<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="スコアブック">
<meta name="theme-color" content="#0d2a5c">
<title>スコアブック | 女子バレー試合記録</title>
<style>
:root{
  --bg:#b3c0d8; --bg2:#f4f7fc; --card:#ffffff; --card2:#e9eff9; --line:#c7d5ee;
  --txt:#101f3c; --sub:#54678c; --accent:#2563eb; --accent2:#ea580c; --accent-on:#ffffff;
  --grad:linear-gradient(120deg,#0d2a5c 0%,#1d4ed8 55%,#0ea5e9 100%);
  --input-bg:#ffffff; --sel-bg:#dbeafe;
  --good:#0da271; --good-bg:#dcf7ea; --good-tx:#0a5c3a;
  --bad:#e5484d; --bad-bg:#fde3e5; --bad-tx:#8c1d2f;
  --warn:#d97706; --warn-bg:#fef3c7; --warn-tx:#92400e;
  --radius:16px;
  --q-us:#1e40af; --q-us-line:#172f63;
  --q-them:#c2410c; --q-them-line:#7c2d12;
  --util:#e8ebef; --util-line:#a7b0bc; --util-tx:#3c4656;
  --navy:#0d2a5c; --gold:#ffc400;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
html{touch-action:manipulation; overflow:hidden;}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--txt); height:100%;
  /* iPad Safari対策：文書（ページ）自体は絶対にスクロールさせない。
     position:fixed で画面に固定し、スクロールは各ビュー内の専用領域だけに閉じ込める。
     これによりボタン操作のたびに画面全体がずれたり、ブラウザの下部ツールバーが
     出入りしたりするのを防ぐ。 */
  position:fixed; inset:0; width:100%;
  overflow:hidden; overscroll-behavior:none;
}
button{font-family:inherit; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none;}
/* 操作系エリアは長押し選択・ダブルタップズームを抑止（入力欄だけはテキスト選択可） */
.match-topbar,.set-tabs,.score-strip,.input-col,.side-col{user-select:none; -webkit-user-select:none;}
input,select,textarea{user-select:text; -webkit-user-select:text;}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--txt); background:var(--input-bg);}
h1,h2,h3{margin:0;}
.hidden{display:none !important;}
/* ホームは専用のスクロール領域を持つ（body自体は固定されているため） */
#view-home{height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;}

/* ===== ヘッダー ===== */
.app-header{
  background:#1d4ed8; color:#fff; padding:6px 16px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:30;
  box-shadow:0 2px 10px rgba(20,50,110,.25);
}
.app-header .ttl{font-size:18px; font-weight:800; letter-spacing:.02em;}
.app-header .sub{font-size:12px; color:#dbeafe;}
.app-header .sp{flex:1;}
.logo-badge{background:#fff; border-radius:10px; padding:3px 7px; display:flex; align-items:center; flex:none; box-shadow:0 1px 4px rgba(10,30,80,.35);}
.logo-badge svg{height:30px; width:auto; display:block;}
.team-setting{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; box-shadow:0 1px 4px rgba(30,60,120,.06);}
.team-setting label{font-size:15px; font-weight:800;}
.team-setting input{flex:1; min-width:180px; font-size:16px; padding:9px 12px; border:1.5px solid var(--line); border-radius:10px;}
.team-setting .ts-note{flex-basis:100%; font-size:12px; color:var(--sub); font-weight:600;}
.hbtn{
  background:#416ade; color:#fff; border:1px solid #7aa5f0;
  border-radius:10px; padding:6px 12px; font-size:14px; font-weight:700; min-height:40px;
}
.hbtn:active{background:#6587e4;}

.wrap{max-width:1180px; margin:0 auto; padding:14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:0 1px 4px rgba(30,60,120,.06);}

/* ===== ホーム ===== */
.match-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(30,60,120,.06);
}
.match-card .mc-title{font-size:19px; font-weight:800;}
.match-card .mc-meta{color:var(--sub); font-size:13px; margin-top:2px;}
.match-card .mc-score{font-size:16px; font-weight:700; margin-top:6px;}
.match-card .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.btn{
  border-radius:12px; border:1px solid var(--line); background:var(--card2); color:var(--txt);
  padding:10px 16px; font-size:15px; font-weight:700; min-height:48px;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.danger{background:var(--bad-bg); border-color:var(--bad); color:var(--bad-tx);}
.btn:active{filter:brightness(.94);}
.big-add{width:100%; min-height:64px; font-size:18px; margin-bottom:14px;}
.empty-note{color:var(--sub); text-align:center; padding:28px 10px; font-size:15px;}

/* ===== 記録画面レイアウト ===== */
#view-match{display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; position:fixed; top:0; left:0; right:0; z-index:10;}
.match-topbar{
  display:flex; align-items:center; gap:8px; padding:2px 12px; flex-wrap:wrap;
  background:var(--card); border-bottom:1px solid var(--line);
}
.match-topbar .btn{min-height:44px; padding:6px 10px;}
.match-topbar .mt-title{font-size:17px; font-weight:800;}
.sets-count{font-size:15px; font-weight:800; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:5px 10px;}
.fmt-label{font-size:12px; font-weight:700; color:var(--sub); border:1px solid var(--line); border-radius:10px; padding:5px 8px;}
.set-tabs{display:flex; gap:6px; flex-wrap:wrap; padding:0 12px; background:var(--card);}
.set-tab{
  border:1px solid var(--line); background:var(--card); border-radius:10px 10px 0 0;
  padding:4px 11px; font-size:14px; font-weight:700; min-height:34px; color:var(--sub);
}
.set-tab.cur{background:var(--accent); border-color:var(--accent); color:#fff;}
.set-tab.fin{color:var(--good-tx); background:var(--good-bg);}
.set-tab.fin.cur{background:var(--accent); color:#fff;}
.score-strip{
  display:flex; align-items:center; gap:14px; padding:1px 14px; flex-wrap:wrap;
  background:var(--card); border-bottom:1px solid var(--line);
}
.big-score{font-size:32px; font-weight:900; line-height:1; letter-spacing:.01em;}
.big-score .team-name{font-size:16px; font-weight:800; vertical-align:middle;}
/* スコア帯もチームカラーで統一（自=青／相手=橙） */
.big-score .team-name.us{color:var(--accent);}
.big-score .team-name.them{color:var(--accent2);}
#bs-us{color:var(--accent);}
#bs-them{color:var(--accent2);}
#btn-undo{margin-left:auto; min-height:44px;}
.serve-now{
  font-size:15px; font-weight:800; background:var(--warn-bg); color:var(--warn-tx);
  border:1px solid var(--warn); border-radius:999px; padding:6px 14px;
}
/* スコア帯のサーブ権マーク（現在のサーブチーム側に常時表示。消すときは
   visibility で隠してレイアウトの幅を変えない） */
.serve-ball{display:inline-block; font-size:19px; line-height:1; vertical-align:middle; margin:0 3px;}
.serve-ball.off{visibility:hidden;}
/* サイドアウト時のサーブ権フラッシュ（オーバーレイ表示のみ。レイアウトは一切ずらさない） */
.serve-flash{
  position:fixed; left:50%; top:66px; transform:translateX(-50%) scale(.92); z-index:98;
  background:#b45309; color:#fff; padding:12px 26px; border-radius:999px;
  font-size:21px; font-weight:900; letter-spacing:.02em; white-space:nowrap;
  box-shadow:0 6px 22px rgba(0,0,0,.35); opacity:0; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease;
}
.serve-flash.show{opacity:1; transform:translateX(-50%) scale(1);}
/* 手順エラー表示（オーバーレイのみ。レイアウトは一切ずらさない） */
.error-flash{
  position:fixed; left:50%; top:66px; transform:translateX(-50%) scale(.92); z-index:99;
  background:#c81e1e; color:#fff; padding:12px 22px; border-radius:14px;
  font-size:16px; font-weight:800; line-height:1.45; max-width:min(92vw,560px); text-align:center;
  box-shadow:0 6px 22px rgba(0,0,0,.35); opacity:0; pointer-events:none;
  transition:opacity .15s ease, transform .15s ease;
}
.error-flash.show{opacity:1; transform:translateX(-50%) scale(1);}
/* 手順ロック中のゾーン：ボタンは薄色になり、押しても記録されずエラーが出る */
.step-zone.locked .actor-btn, .step-zone.locked .chip{
  background:#edf1f7; color:#8593ad; border-color:var(--line); box-shadow:none;
}
.step-zone.locked .actor-btn.on{ background:#edf1f7; color:#8593ad; }
.step-zone.locked .unknown-btn{ background:#edf1f7; color:#8593ad; }
/* 「誰が」ゾーン見出し右の『不明』ボタン（選手が分からないときに手順②を進める） */
.unknown-btn{
  margin-left:auto; flex:none; min-height:36px; padding:4px 14px; border-radius:999px;
  border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:13px; font-weight:800; cursor:pointer;
}
.unknown-btn.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
.setend-banner{
  margin:0 12px; background:var(--good-bg); color:var(--good-tx); border:1px solid var(--good);
  border-radius:12px; padding:8px 14px; font-weight:800; font-size:15px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.record-main{flex:1; display:flex; gap:8px; padding:3px 12px; min-height:0;}
.book-area{flex:1; display:flex; flex-direction:column; min-width:0; gap:6px;}
.book-scroll{
  flex:1; overflow:hidden;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
}
/* 密度の下限でも収まらない長いセットのときだけ、表エリアをスクロール可能にする
   （fitBook() が .fit-scroll を付け外しする）。ページ全体・入力列は一切スクロールしない。 */
.book-scroll.fit-scroll{overflow-y:auto; -webkit-overflow-scrolling:touch;}
/* スコアブック表はラリー数に応じて密度（文字・行間・列幅）を自動調整して
   原則スクロールなしで全行を1画面に収める。密度は JS の fitBook() が
   CSS変数（--bfs等）と data-fit-tier で切り替える。
   下限の密度でも収まらない長いセットでは、表エリアだけがスクロールし、
   新しいラリーのたびに最新行まで自動スクロールする。 */
table.book{border-collapse:collapse; width:100%; font-size:var(--bfs,14px);}
table.book th, table.book td{border:1px solid var(--line); padding:var(--bpad,4px) 6px; text-align:center; line-height:var(--blh,1.35);}
table.book thead th{background:var(--card2);}
table.book thead tr.team-head th{font-size:calc(var(--bfs,14px) + 1px);}
table.book th.c-server, table.book td.c-server{width:var(--bsrv,64px);}
table.book th.c-point, table.book td.c-point{width:var(--bptw,52px);}
table.book th.c-server, table.book th.c-point{font-weight:800;}
/* 得点：主役として大きく・太く・濃く。チームカラー（自=青／相手=橙）で区別する */
table.book td.c-point{font-weight:900; font-size:calc(var(--bfs,14px) + 3px); line-height:1.15;}
table.book td.c-point.us{color:var(--accent);}
table.book td.c-point.them{color:var(--accent2);}
/* サーバー番号：小さめ・グレーの丸バッジにして「サーバー」と一目で分かる形にする */
.srv-badge{display:inline-block; min-width:1.8em; padding:0 .25em; border:1px solid var(--line); border-radius:999px; background:var(--card2); color:var(--sub); font-size:.82em; font-weight:700; line-height:1.45; white-space:nowrap;}
/* 最新の得点セル：短時間ハイライト（アニメーションのみでレイアウトは動かさない） */
table.book td.c-point.pt-new{animation:ptPulse 1.6s ease-out 1;}
@keyframes ptPulse{
  0%{background:#fde68a; box-shadow:inset 0 0 0 3px #d97706;}
  100%{background:transparent; box-shadow:inset 0 0 0 3px rgba(217,119,6,0);}
}
@media (prefers-reduced-motion: reduce){
  table.book td.c-point.pt-new{animation:none; background:#fde68a;}
}
/* 摘要：密度が下がったティアでも読みやすいよう少し太くする */
table.book td.c-note{text-align:left; font-size:var(--bnfs,13px); font-weight:600;}
/* チーム見出しの色分け（自=青系／相手=橙系で、得点セル・スコア帯と統一） */
table.book thead tr.team-head th.th-us{background:#dbeafe; color:#1e40af;}
table.book thead tr.team-head th.th-them{background:#ffedd5; color:#9a3412;}
/* 表ヘッダー固定：長いセットで表エリアがスクロールする状態（.fit-scroll）でも
   見出しが上部に残るようにする。スクロールしない状態では通常位置のままで崩れない。
   2行目の top は fitBook() が1行目の実高さを測って --bth1 に入れる。 */
table.book thead th{position:sticky; z-index:2;}
table.book thead tr.team-head th{top:0;}
table.book thead tr:nth-child(2) th{top:var(--bth1,30px);}
/* 最新行の強調：左端にアクセントバーを付けて直近の行を一目で分かるようにする */
table.book tr.latest td:first-child{box-shadow:inset 4px 0 0 var(--accent);}
table.book tr.latest td{background:var(--sel-bg);}
table.book tr.note-row td{background:#fbfcfe; color:var(--sub); font-size:var(--bnfs,13px);}
table.book tr.final-row td{font-weight:900; font-size:calc(var(--bfs,14px) + 1px); background:var(--card2);}
table.book tr.win-us td.c-point.us{background:var(--good-bg);}
.server-badge{display:inline-block; background:var(--accent); color:#fff; border-radius:6px; padding:0 6px; font-size:12px; margin-left:4px;}
.comment-box{width:100%; display:flex; align-items:center; gap:8px;}
.comment-box label{font-size:12px; font-weight:700; color:var(--sub); flex:none;}
.comment-box textarea{flex:1; height:34px; min-height:34px; border:1px solid var(--line); border-radius:10px; padding:6px 8px; background:var(--input-bg); resize:none;}

/* ===== 入力列 ===== */
.input-col{width:336px; flex:none; display:flex; flex-direction:column; gap:2px; overflow:hidden; padding-bottom:0;}
.pt-btns{display:flex; gap:8px;}
.pt-btn{
  flex:1; min-height:72px; border-radius:14px; font-size:22px; font-weight:900; color:#fff; border:2px solid;
}
.pt-btn.us{background:var(--q-us); border-color:var(--q-us-line);}
.pt-btn.them{background:var(--q-them); border-color:var(--q-them-line);}
.pt-btn:active{filter:brightness(1.25);}
.pt-btn:disabled{opacity:.4;}
.col-label{font-size:13px; font-weight:800; color:var(--sub); margin-top:0; line-height:1.3;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:6px 11px; font-size:14px; font-weight:700; min-height:48px;
}
.chip:active{background:var(--sel-bg);}
/* 摘要チップはグリッド配置で全て同じ幅・同じ高さに統一する */
.chip-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
.chip-grid .chip{
  width:100%; height:44px; min-height:44px; padding:2px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size:13px; line-height:1.15;
}
.note-group-label{font-size:12px; font-weight:900; margin:0; line-height:1.25; white-space:nowrap;}
/* ===== 入力フローガイド（①得点→②誰が→③摘要：順番バッジ＋次のゾーンの発光） =====
   発光は box-shadow のアニメーションのみで、レイアウトは一切ずらさない。
   手順が違うゾーンはロックされ（薄色表示）、押しても記録されずエラーが表示される。 */
.step-head{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--sub); line-height:1.25; margin-bottom:0;}
.step-badge{
  flex:none; width:17px; height:17px; border-radius:50%; background:var(--sub); color:#fff;
  font-size:11px; font-weight:900; line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
}
.step-sub{font-size:11px; font-weight:700; color:#8593ad;}
.step-zone{border-radius:14px;}
.step-zone.guide{animation:guidePulse 1.8s ease-in-out infinite;}
.step-zone.guide .step-badge{background:var(--accent);}
.step-zone.guide .step-head{color:var(--accent);}
@keyframes guidePulse{
  0%,100%{box-shadow:0 0 0 2px rgba(37,99,235,.28), 0 0 0 5px rgba(37,99,235,.05);}
  50%{box-shadow:0 0 0 3px rgba(37,99,235,.7), 0 0 16px 5px rgba(37,99,235,.30);}
}
@media (prefers-reduced-motion: reduce){
  .step-zone.guide{animation:none; box-shadow:0 0 0 3px rgba(37,99,235,.7);}
}
.note-group-label.pt{color:var(--good-tx);}
.note-group-label.ms{color:var(--bad-tx);}
.chip.pt{background:var(--good-bg); border-color:var(--good); color:var(--good-tx);}
.chip.pt:active{filter:brightness(.96);}
.chip.ms{background:var(--bad-bg); border-color:var(--bad); color:var(--bad-tx);}
.chip.ms:active{filter:brightness(.96);}
.memo-row{display:flex; gap:6px;}
.memo-row .chip{height:48px; flex:none;}
.memo-row input{flex:1; border:1px solid var(--line); border-radius:10px; padding:8px; background:var(--input-bg); min-height:44px; min-width:0;}
.util-btns{display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:6px;}
.ubtn{
  border:1px solid var(--util-line); background:var(--util); color:var(--util-tx);
  border-radius:10px; padding:8px 6px; font-size:14px; font-weight:700; min-height:48px;
}
.ubtn:active{filter:brightness(.95);}
.ubtn:disabled{opacity:.4;}
.ubtn.wide{grid-column:1 / -1;}
.finish-btn{background:var(--good); border-color:var(--good); color:#fff;}
.manual-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.manual-row .mbtn{border:1px solid var(--util-line); background:#fff; border-radius:8px; min-width:48px; min-height:48px; font-size:15px; font-weight:800;}
/* その他操作ゾーン（交代・タイムアウト・修正）：普段は閉じて入力動線を短く保つ。
   開いたときはトグルの上に重なるオーバーレイ表示にして、入力列のレイアウト高さを
   変えない（＝どの状態でも入力列がスクロールしない）ようにする。 */
.util-wrap{position:relative;}
.util-zone{
  display:flex; flex-direction:column; gap:6px;
  position:absolute; left:0; right:0; bottom:calc(100% + 6px); z-index:25;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:10px; box-shadow:0 8px 24px rgba(20,40,90,.28);
}
.util-toggle{width:100%; position:relative; z-index:26; min-height:44px;}
.manual-note{font-size:12px; color:var(--warn-tx); font-weight:700;}

/* ===== 誰がセレクタ ===== */
.actor-team{font-size:12px; font-weight:800; color:var(--sub); margin:0; line-height:1.25;}
.actor-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:4px;}
/* 相手は番号のみ表示なので6列にして1行に収め、入力列の縦を空ける */
.actor-btns.them-grid{grid-template-columns:repeat(6,1fr);}
.actor-btn{
  min-width:44px; height:44px; min-height:44px; border:1px solid var(--line); background:var(--card);
  border-radius:10px; font-size:16px; font-weight:800; padding:4px 7px; color:var(--txt);
  display:inline-flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15;
}
.actor-btns .actor-btn{width:100%;}
.actor-btn .aname{
  font-size:10px; font-weight:700; opacity:.85; line-height:1.15;
  max-width:68px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.actor-btn.on{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 2px #fff, 0 0 0 5px var(--accent);}
.actor-btn.lib{border-style:dashed;}
.actor-btn:disabled{opacity:.4;}
.actor-num-row{display:flex; gap:6px;}
.actor-num-row input{width:84px; min-height:44px; border:1px solid var(--line); border-radius:10px; padding:6px; background:var(--input-bg);}
.actor-sel-note{font-size:12px; color:var(--accent); font-weight:700; margin-top:2px; line-height:1.3;}

/* ===== コート表示（サイド列） ===== */
.side-col{width:212px; flex:none; display:flex; flex-direction:column; gap:8px; overflow:hidden;}
.court{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px;}
.court-title{font-size:12px; font-weight:800; color:var(--sub); margin-bottom:4px;}
.court-net{height:7px; border-radius:3px; background:repeating-linear-gradient(90deg,#33475f 0 6px,#7d90ad 6px 12px); margin-bottom:5px;}
.court-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
.court-3m{border-top:2px dashed #b6c3da; margin:4px 0;}
.court-cell{
  position:relative; border:1px solid var(--line); border-radius:8px; background:var(--card2);
  min-height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden; padding:1px 2px;
}
.court-cell .cnum{font-size:19px; font-weight:900; line-height:1.1;}
.court-cell .cname{
  font-size:9px; font-weight:700; color:var(--sub); line-height:1.15;
  max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.court-cell .pos{position:absolute; top:1px; left:4px; font-size:9px; font-weight:700; color:var(--sub);}
.court-cell .sball{position:absolute; top:0; right:2px; font-size:12px;}
.court-cell.server{background:var(--warn-bg); border-color:var(--warn);}
/* サイドアウト直後、新しいサーバー（ポジション1）を短時間パルス表示する。
   アニメーション終了後は通常の .server 表示に戻る（クラス自体は次回描画で消える） */
@keyframes servePulse{
  0%{box-shadow:0 0 0 0 rgba(217,119,6,.0); background:var(--warn-bg);}
  30%{box-shadow:0 0 0 3px #d97706, 0 0 14px 3px rgba(217,119,6,.75); background:#fde68a;}
  100%{box-shadow:0 0 0 0 rgba(217,119,6,0); background:var(--warn-bg);}
}
.court-cell.serve-flash{animation:servePulse .45s ease-in-out 3; border-color:#d97706;}
.court.mini .court-cell{min-height:34px;}
.court.mini .court-cell .cnum{font-size:15px;}
.libero-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.libero-label{font-size:12px; font-weight:800; color:var(--sub);}
.libero-chip{background:var(--sel-bg); border:1px dashed var(--accent); color:var(--accent); border-radius:999px; padding:4px 10px; font-size:13px; font-weight:800;}

/* ===== セット設定 ===== */
.setup-panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 12px;}
.setup-panel h3{font-size:15px; margin-bottom:8px;}
.setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.setup-grid .sg-title{font-weight:800; font-size:14px; margin-bottom:6px;}
.order-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}
.order-grid label{font-size:11px; color:var(--sub); display:block;}
.order-grid select, .order-grid input{width:100%; min-height:44px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); padding:4px;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.seg button{border:none; background:var(--card); padding:10px 18px; font-size:15px; font-weight:700; min-height:44px;}
.seg button.on{background:var(--accent); color:#fff;}

/* ===== モーダル ===== */
.modal-back{
  position:fixed; inset:0; background:rgba(15,25,50,.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:14px;
}
.modal{
  background:var(--card); border-radius:var(--radius); padding:18px; width:100%; max-width:560px;
  max-height:92dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.modal h3{font-size:17px; margin-bottom:12px;}
.f-row{margin-bottom:10px;}
.f-row label{display:block; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:4px;}
.f-row input, .f-row select, .f-row textarea{
  width:100%; border:1px solid var(--line); border-radius:10px; padding:9px; background:var(--input-bg); min-height:44px;
}
.f-2col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-btns{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.modal-btns .btn{flex:1;}
.roster-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.roster-grid .f-row{margin-bottom:0;}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:99;
  background:#16233d; color:#fff; padding:12px 20px; border-radius:999px; font-size:15px; font-weight:700;
  box-shadow:0 4px 16px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .25s;
  max-width:92vw; text-align:center;
}
.toast.show{opacity:1;}

/* ===== 横向き・幅が狭い画面（1024級）：表に幅を譲って摘要の折返しを減らす ===== */
@media (max-width:1100px) and (orientation:landscape){
  .side-col{width:184px;}
  .input-col{width:320px;}
  .court-cell{min-height:36px;}
  .court-cell .cnum{font-size:17px;}
  .court.mini .court-cell{min-height:30px;}
}

/* ===== 縦向き・狭幅 ===== */
@media (max-width:900px), (orientation:portrait) and (max-width:1100px){
  .record-main{flex-direction:column; overflow-y:auto;}
  .book-area{flex:none; height:46dvh;}
  .side-col{width:100%; flex:none; overflow:visible;}
  .side-col .court{width:100%; max-width:300px; margin:0 auto;}
  .libero-row{justify-content:center;}
  .input-col{width:100%; flex:none; overflow:visible;}
  .big-score{font-size:36px;}
  .setup-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:1fr;}
}

/* ===== ビュー切替（記録／統計） ===== */
#view-record{display:flex; flex-direction:column; flex:1; min-height:0;}
.btn.view-on{background:var(--accent); border-color:var(--accent); color:#fff;}
.chip.view-on{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ===== セット設定の要約バー・入力ロック ===== */
.setup-summary{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--good-bg); border:1px solid var(--good); border-radius:12px;
  padding:2px 12px; margin:0 12px;
}
.setup-summary .ss-txt{font-weight:800; font-size:14px; color:var(--good-tx);}
.setup-summary .ss-order{font-size:13px; font-weight:700;}
.setup-summary .btn{margin-left:auto; min-height:32px; padding:2px 12px;}
.setup-locked{
  border:1px dashed var(--warn); background:var(--warn-bg); color:var(--warn-tx);
  border-radius:12px; padding:14px; font-size:14px; font-weight:700; line-height:1.7;
}

/* ===== 統計・分析 ===== */
#view-stats{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px;}
.stats-note{
  background:var(--card2); border:1px solid var(--line); border-radius:12px;
  padding:10px 14px; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:12px; line-height:1.6;
}
.stats-card{margin-bottom:12px;}
.stats-card h3{font-size:16px; margin-bottom:10px;}
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
.stats-grid .stats-card{margin-bottom:0;}
.stats-sets{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
.stats-set-chip{
  background:var(--card2); border:1px solid var(--line); border-radius:10px;
  padding:6px 12px; font-size:14px; font-weight:800;
}
table.stats-table{border-collapse:collapse; width:100%; font-size:14px;}
table.stats-table th, table.stats-table td{border:1px solid var(--line); padding:6px 8px; text-align:center;}
table.stats-table th{background:var(--card2);}
table.stats-table td:first-child{text-align:left; font-weight:700;}
.stats-svg{width:100%; height:auto; display:block;}
.stats-empty{color:var(--sub); font-size:14px; padding:10px 0;}

/* ===== 印刷 ===== */
#print-area{display:none;}
@media print{
  body{background:#fff;}
  /* 画面固定（position:fixed / overflow:hidden）は印刷では解除し、全ページ印刷できるようにする */
  html,body{height:auto !important; overflow:visible !important; position:static !important;}
  #view-home{height:auto !important; overflow:visible !important;}
  #view-match{position:static !important;}
  #app{display:none !important;}
  #print-area{display:block !important; color:#000; font-size:12px;}
  #print-area h1{font-size:17px; margin:0 0 6px;}
  #print-area .p-title-row{display:flex; align-items:center; gap:12px; margin:0 0 8px;}
  #print-area .p-title-row h1{margin:0;}
  #print-area .p-logo{height:15mm; width:15mm;}
  #print-area h2{font-size:14px; margin:14px 0 4px; border-bottom:2px solid #000; padding-bottom:2px;}
  #print-area table{border-collapse:collapse; width:100%; margin-bottom:8px;}
  #print-area th, #print-area td{border:1px solid #666; padding:2px 4px; text-align:center; font-size:11px;}
  #print-area td.note{text-align:left;}
  /* 印刷でもサーバー番号と得点を区別する（色に頼らずサイズ・太さ・囲みで）：
     得点は大きく太く、サーバー番号は小さく丸囲みに */
  #print-area td.p-pt{font-size:14px; font-weight:900;}
  #print-area .p-srv{display:inline-block; min-width:16px; padding:0 4px; border:1.5px solid #000; border-radius:999px; font-size:9px; font-weight:700; line-height:1.5;}
  #print-area .p-head td{text-align:left;}
  #print-area .p-comment{border:1px solid #666; padding:4px 6px; min-height:22px; text-align:left;}
  #print-area .p-set{page-break-inside:avoid;}
  @page{size:A4; margin:12mm;}
}
/* ============================================================
   デザイン「アリーナ・ナイト」オーバーライド層
   深いネイビー×ミカサゴールド。電光掲示板風スコア帯と
   本物のコート（青い床・黄の3mライン）でバレーらしさを出す。
   寸法（高さ・余白・文字サイズ）は現行と同一に保ってある。
   ============================================================ */
body{background:#b3c0d8;}
/* ヘッダー */
.app-header{background:#0d2a5c;border-bottom:3px solid var(--gold);box-shadow:0 3px 14px rgba(6,20,50,.4);}
.app-header .sub{color:#b9cdf2;}
.logo-badge{border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.hbtn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.4);color:#fff;}
.hbtn:active{background:rgba(255,255,255,.28);}
/* ホーム */
.btn.primary{background:var(--navy);border-color:#0d2a5c;box-shadow:0 3px 10px rgba(13,42,92,.35);}
.big-add{border-radius:16px;letter-spacing:.03em;}
.match-card{border-left:5px solid var(--accent);box-shadow:0 2px 8px rgba(13,42,92,.10);}
.match-card .mc-title{color:var(--navy);}
/* 試合トップバー（ヘッダーと一体のネイビー帯） */
.match-topbar{background:#0d2a5c;border-bottom:1px solid var(--gold);color:#fff;}
.match-topbar .btn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.38);color:#fff;}
.match-topbar .btn:active{background:rgba(255,255,255,.28);}
.match-topbar .btn.view-on{background:var(--gold);border-color:var(--gold);color:#231a00;}
.match-topbar .mt-title{color:#fff;}
.sets-count{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;}
.fmt-label{border-color:rgba(255,255,255,.35);color:#cfe0fa;}
/* セットタブ（現在セット＝金） */
.set-tabs{background:#0d2a5c;}
.set-tab{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.25);color:#cfe0fa;}
.set-tab.cur{background:var(--gold);border-color:var(--gold);color:#231a00;}
.set-tab.fin{background:rgba(13,162,113,.28);color:#8ff0cd;}
.set-tab.fin.cur{background:var(--gold);color:#231a00;}
/* スコア帯＝電光掲示板 */
.score-strip{background:#0a1f45;border-bottom:1px solid #04122b;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 8px rgba(4,15,40,.35);}
.big-score{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);}
.big-score .team-name.us{color:#7db4ff;}
.big-score .team-name.them{color:#ffb27d;}
#bs-us{color:#fff;}
#bs-them{color:#fff;}
.serve-ball{filter:drop-shadow(0 0 5px rgba(255,196,0,.95));}
.serve-now{background:var(--gold);border-color:#b78a00;color:#231a00;box-shadow:0 0 10px rgba(255,196,0,.45);}
.score-strip .manual-note{color:#fcd34d;}
.score-strip .btn{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.38);color:#fff;}
/* 得点ボタン（チームカラーのグラデーション） */
.pt-btn{border-radius:18px;letter-spacing:.02em;box-shadow:0 4px 12px rgba(10,25,60,.30),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18);text-shadow:0 1px 3px rgba(0,0,0,.35);}
.pt-btn.us{background:#1d4ed8;border-color:#0d2c66;}
.pt-btn.them{background:#ea580c;border-color:#7c2d12;}
.pt-btn:active{filter:brightness(1.18);}
/* ステップゾーンのカード化（枠は box-shadow で描き、寸法は変えない） */
.step-zone{background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 4px rgba(13,42,92,.08);}
.step-zone.locked{background:#eef2f8;box-shadow:0 0 0 1px var(--line);}
.step-badge{background:var(--navy);}
.step-zone.guide .step-badge{background:var(--gold);color:#231a00;}
.step-zone.guide .step-head{color:#92400e;}
@keyframes guidePulse{
  0%,100%{box-shadow:0 0 0 2px rgba(217,119,6,.35),0 0 0 5px rgba(255,196,0,.10);}
  50%{box-shadow:0 0 0 3px rgba(217,119,6,.75),0 0 16px 5px rgba(255,196,0,.35);}
}
@media (prefers-reduced-motion: reduce){
  .step-zone.guide{box-shadow:0 0 0 3px rgba(217,119,6,.75);}
}
/* チップ・選手ボタン */
.chip-grid .chip{border-radius:12px;font-weight:800;}
.chip.pt{background:#cdf5dd;}
.chip.ms{background:#ffd9de;}
.actor-btn{border-radius:12px;}
.actor-btn.on{background:#1d4ed8;}
/* スコアブック表 */
table.book thead tr.team-head th.th-us{background:#123064;color:#fff;}
table.book thead tr.team-head th.th-them{background:#9a3412;color:#fff;}
table.book thead th{background:#e3ebf9;}
table.book tr.latest td{background:#fff3cf;}
table.book tr.latest td:first-child{box-shadow:inset 4px 0 0 #d97706;}
.book-scroll{border-radius:14px;box-shadow:0 2px 8px rgba(13,42,92,.10);}
.book-scroll.fit-scroll::-webkit-scrollbar{width:8px;}
.book-scroll.fit-scroll::-webkit-scrollbar-thumb{background:#9db6dd;border-radius:4px;}
/* コート（青い床・黄の3mライン・白ネット） */
.court{background:#0d2a5c;border-color:#061831;border-radius:14px;box-shadow:0 3px 10px rgba(6,20,50,.35);}
.court-title{color:#cfe0fa;}
.court-net{background:repeating-linear-gradient(90deg,#f8fafc 0 5px,#94a3b8 5px 10px);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.court-grid{background:#2563eb;border-radius:6px;}
.court-3m{border-top:3px dashed var(--gold);}
.court .court-cell{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);}
.court .court-cell .cnum{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);}
.court .court-cell .cname{color:#dbeafe;}
.court .court-cell .pos{color:#bcd3f7;}
.court .court-cell.server{background:var(--gold);border-color:#b78a00;}
.court .court-cell.server .cnum{color:#231a00;text-shadow:none;}
.court .court-cell.server .cname,.court .court-cell.server .pos{color:#5c4700;}
@keyframes servePulse{
  0%{box-shadow:0 0 0 0 rgba(255,196,0,0);background:var(--gold);}
  30%{box-shadow:0 0 0 3px #b78a00,0 0 16px 4px rgba(255,196,0,.8);background:#ffe066;}
  100%{box-shadow:0 0 0 0 rgba(255,196,0,0);background:var(--gold);}
}
.libero-chip{background:#e3ecfd;border-color:var(--navy);color:var(--navy);}
.libero-label{color:var(--navy);}
/* セット設定の要約・モーダル・統計 */
.setup-summary{background:var(--sel-bg);border-color:#93c5fd;}
.setup-summary .ss-txt{color:var(--navy);}
.modal{border-top:5px solid var(--gold);}
.stats-card h3{color:var(--navy);}
.btn.view-on{background:var(--navy);border-color:var(--navy);}
/* キーボード等でもフォーカスが見えるように */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:1px;}

/* ===== 追加機能：タイマー／連続得点／保存状態／設定背景／ダークモード ===== */
.save-status{font-size:11px;font-weight:700;color:#9db9e8;white-space:nowrap;}
.streak-inline{font-size:15px;font-weight:900;color:var(--gold);margin-left:10px;vertical-align:middle;white-space:nowrap;}
.streak-inline.them{color:#ffb27d;}
.timer-pill{
  position:fixed; right:14px; bottom:14px; z-index:97; cursor:pointer;
  background:#0d2a5c; color:#fff; border:2px solid var(--gold); border-radius:999px;
  padding:8px 16px; font-size:18px; font-weight:900; box-shadow:0 4px 14px rgba(0,0,0,.35);
  font-variant-numeric:tabular-nums;
}
.timer-pill.done{background:#c81e1e; animation:timerBlink .7s ease-in-out 6;}
@keyframes timerBlink{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.timer-panel{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:96;
  background:var(--card); color:var(--txt); border:1px solid var(--line); border-top:5px solid var(--gold);
  border-radius:16px; padding:18px 20px; box-shadow:0 12px 34px rgba(0,0,0,.4);
  text-align:center; width:min(92vw,340px);
}
.tp-title{font-size:15px; font-weight:900;}
.tp-time{font-size:52px; font-weight:900; line-height:1.15; font-variant-numeric:tabular-nums;}
.tp-presets,.tp-controls{display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
.tp-note{font-size:12px; color:var(--sub); margin-top:8px;}
#export-reminder{
  background:var(--warn-bg); border:1px solid var(--warn); color:var(--warn-tx);
  border-radius:12px; padding:10px 14px; margin-bottom:12px;
  font-size:14px; font-weight:700; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
/* 設定画面（セット設定パネル・試合情報モーダル）：背景に色を付けて入力欄を浮かせる */
.setup-panel{background:#d9e5f9; border-color:#a9c0e8;}
.setup-panel select, .setup-panel input{border-color:#7d94c4;}
.modal{background:#e9eff9;}
.f-row input, .f-row select, .f-row textarea{border-color:#8aa3cf;}
/* ダークモード */
html[data-theme="dark"]{
  --bg:#0d1524; --bg2:#16223c; --card:#1a2742; --card2:#22314f; --line:#35497a;
  --txt:#e9effc; --sub:#9db1d6; --input-bg:#0f1a30; --sel-bg:#274b8f;
  --good-bg:#0d3527; --good-tx:#6ee7b7; --bad-bg:#3d1520; --bad-tx:#fda4af;
  --warn-bg:#3a2c07; --warn-tx:#fcd34d;
  --util:#22314f; --util-line:#3d548c; --util-tx:#d7e3fb;
}
html[data-theme="dark"] body{background:#0d1524;}
html[data-theme="dark"] .step-zone{background:var(--card);}
html[data-theme="dark"] .step-zone.locked{background:#131f38;}
html[data-theme="dark"] table.book thead th{background:#22314f;}
html[data-theme="dark"] table.book tr.latest td{background:#3a2f10;}
html[data-theme="dark"] table.book tr.note-row td{background:#16223c;}
html[data-theme="dark"] .chip.pt{background:#0d3527;}
html[data-theme="dark"] .chip.ms{background:#3d1520;}
html[data-theme="dark"] .libero-chip{background:#22314f; color:#cfe0fa;}
html[data-theme="dark"] .srv-badge{background:#22314f; color:#cfe0fa;}
html[data-theme="dark"] .setup-panel{background:#1d2c4e; border-color:#35497a;}
html[data-theme="dark"] .setup-summary{background:#1d2c4e;border-color:#46639f;}
html[data-theme="dark"] .setup-summary .ss-txt{color:#93c5fd;}
html[data-theme="dark"] .setup-panel select, html[data-theme="dark"] .setup-panel input{border-color:#46639f;}
html[data-theme="dark"] .modal{background:var(--card);}
html[data-theme="dark"] .unknown-btn{background:#22314f; color:#cfe0fa;}
html[data-theme="dark"] .manual-row .mbtn{background:#22314f; color:#e9effc;}
html[data-theme="dark"] .seg button{background:var(--card); color:var(--txt);}

<script>
"use strict";
/* ============================================================
   スコアブック（紙のバレーボールスコアブックのデジタル版）
   - データは localStorage のみに保存（キー: vsb_data_v1）
   - スコア・サーブ権・ローテーションは記録ログから再計算する
   ============================================================ */
const LS_KEY = "vsb_data_v1";
/* バレーボールのマーク（インラインSVG：ボール＋スピードライン、青基調）。
   ヘッダーと印刷で共用する。suffix は clipPath の id を一意にするため */
function logoSVG(suffix, cls){
  return '<svg class="' + cls + '" viewBox="0 0 128 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="バレーボール">' +
    '<path d="M8 28h30" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none"/>' +
    '<path d="M3 48h33" stroke="#2563eb" stroke-width="7" stroke-linecap="round" fill="none"/>' +
    '<path d="M8 68h30" stroke="#1e40af" stroke-width="7" stroke-linecap="round" fill="none"/>' +
    '<clipPath id="vbclip-' + suffix + '"><circle cx="86" cy="48" r="40"/></clipPath>' +
    '<circle cx="86" cy="48" r="40" fill="#ffffff"/>' +
    '<g clip-path="url(#vbclip-' + suffix + ')">' +
    '<path d="M46 38 C66 54 106 54 126 38 L126 58 C106 74 66 74 46 58 Z" fill="#2563eb"/>' +
    '<path d="M86 8 C70 30 70 66 86 88" fill="none" stroke="#1e3a8a" stroke-width="4"/>' +
    '<path d="M48 28 C70 42 102 42 124 28" fill="none" stroke="#1e3a8a" stroke-width="4"/>' +
    '<path d="M48 68 C70 54 102 54 124 68" fill="none" stroke="#1e3a8a" stroke-width="4"/>' +
    '</g>' +
    '<circle cx="86" cy="48" r="40" fill="none" stroke="#1e3a8a" stroke-width="5"/></svg>';
}
const LOGO_SVG = logoSVG("p", "p-logo");
/* 自チーム名：設定（DB.settings.teamName）で変更でき、未設定なら「自チーム」 */
function usName(){
  const n = (DB && DB.settings && typeof DB.settings.teamName === "string") ? DB.settings.teamName.trim() : "";
  return n || "自チーム";
}
const MAX_SETS = 6;
const SET_TARGET = 25;      // セット終了の目安点（2点差が必要）
const TIMEOUT_MAX = 2;      // 1セットのタイムアウト上限
/* 試合形式（試合ごとに選択して m.format に保存する）。
   targets＝セット番号ごとの目標点、maxSets＝最大セット数、
   setsToWin＝勝敗決定に必要な先取セット数（0＝勝敗決定なし・全セット実施） */
const MATCH_FORMATS = {
  official3: { label: "公式戦（3セットマッチ）",       short: "公式戦・3セット",         targets: [25,25,25],          maxSets: 3, setsToWin: 2 },
  local3:    { label: "ローカル大会（3セット目15点）", short: "ローカル・3セット目15点", targets: [25,25,15],          maxSets: 3, setsToWin: 2 },
  practice6: { label: "練習試合（6セット）",           short: "練習試合・6セット",       targets: [25,25,25,25,25,25], maxSets: 6, setsToWin: 0 }
};
const DEFAULT_FORMAT = "practice6";  // 形式を持たない既存データは従来動作（練習試合扱い）
function formatKeyOf(m){ return (m && MATCH_FORMATS[m.format]) ? m.format : DEFAULT_FORMAT; }
function matchFormat(m){ return MATCH_FORMATS[formatKeyOf(m)]; }
function setTargetFor(m, idx){ const t = matchFormat(m).targets[idx]; return (typeof t === "number") ? t : SET_TARGET; }
/* 勝敗が決まっていれば 'us' | 'them'、未決着・勝敗決定なし形式なら null */
function matchDecided(m){
  const f = matchFormat(m); if(!f.setsToWin) return null;
  const w = setsWon(m);
  if(w.us >= f.setsToWin) return "us";
  if(w.them >= f.setsToWin) return "them";
  return null;
}
function canAddNextSet(m){
  if(!m) return false;
  if(m.sets.length >= matchFormat(m).maxSets) return false;
  if(matchDecided(m)) return false;
  return true;
}

let DB = loadDB();
let curMatchId = null;      // 現在開いている試合
let curSetIdx = 0;          // 現在表示中のセット番号(0始まり)
let setupOpen = false;      // セット設定パネル表示中か
let selActor = null;        // 摘要に付ける選手 {team:'us'|'them', num} / 未選択は null
let utilOpen = false;       // 入力列の「その他の操作」ゾーン（交代・TO・修正）を開いているか
let matchView = "record";   // 試合画面のビュー: 'record' | 'stats'
let statsSetIdx = 0;        // 統計のスコア推移で表示中のセット番号
let serveFlash = null;      // サイドアウト直後の一時表示 {team, matchId, setIdx, logLen}（保存しない）
let serveFlashTimer = null; // サーブ権フラッシュの消去タイマー
let guideStep = 1;          // 入力フローガイド：次に押すゾーン（1=得点 2=誰が 3=摘要）。保存しない一時状態
let actorSkip = false;      // 手順②を『不明』で進めたか（選手なしで摘要を付ける）。保存しない一時状態
const SERVE_FLASH_MS = 1300; // サーブ権フラッシュの表示時間（ms）

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.matches)) return normalizeData(d); }
  }catch(e){}
  return { matches: [], settings: { teamName: "" } };
}
/* 読込データの欠けたフィールドを既定値で補う（旧形式・外部JSONの読込で
   画面が落ちないようにするため。既にある値はそのまま保持する） */
function normalizeData(d){
  if(!d || !Array.isArray(d.matches)) return { matches: [], settings: { teamName: "" } };
  if(!d.settings || typeof d.settings !== "object") d.settings = {};
  if(typeof d.settings.teamName !== "string") d.settings.teamName = "";
  if(typeof d.settings.dark !== "boolean") d.settings.dark = false;
  if(typeof d.settings.lastExportAt !== "number") d.settings.lastExportAt = 0;
  d.matches.forEach(m=>{
    if(!m.rosterNames || typeof m.rosterNames !== "object") m.rosterNames = {};
    if(!MATCH_FORMATS[m.format]) m.format = DEFAULT_FORMAT;
    if(m.status !== "finished") m.status = "playing";
    if(!Array.isArray(m.sets) || m.sets.length === 0) m.sets = [ newSetObj("us") ];
    m.sets.forEach(s=>{
      if(!Array.isArray(s.usOrder) || s.usOrder.length !== 6) s.usOrder = [null,null,null,null,null,null];
      if(!Array.isArray(s.themOrder) || s.themOrder.length !== 6) s.themOrder = [null,null,null,null,null,null];
      if(!Array.isArray(s.liberos)) s.liberos = [];
      if(!Array.isArray(s.log)) s.log = [];
      if(s.firstServe !== "them") s.firstServe = "us";
      if(typeof s.manualUs !== "number") s.manualUs = 0;
      if(typeof s.manualThem !== "number") s.manualThem = 0;
      if(typeof s.finished !== "boolean") s.finished = false;
      if(s.finalUs === undefined) s.finalUs = null;
      if(s.finalThem === undefined) s.finalThem = null;
      if(typeof s.comment !== "string") s.comment = "";
      if(typeof s.setupDone !== "boolean") s.setupDone = false;
    });
  });
  return d;
}
let lastSaveAt = null;
function saveDB(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); lastSaveAt = new Date(); refreshSaveStatus(); }catch(e){} }
function refreshSaveStatus(){
  const txt = lastSaveAt ? ("✓ 保存済み " + String(lastSaveAt.getHours()).padStart(2,"0") + ":" + String(lastSaveAt.getMinutes()).padStart(2,"0")) : "この端末に自動保存";
  document.querySelectorAll(".save-status").forEach(el=>{ el.textContent = txt; });
}
function appSettings(){ if(!DB.settings || typeof DB.settings !== "object") DB.settings = {}; const s = DB.settings; if(typeof s.teamName !== "string") s.teamName = ""; if(typeof s.dark !== "boolean") s.dark = false; if(typeof s.lastExportAt !== "number") s.lastExportAt = 0; return s; }
function uid(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

/* ---------- データ生成 ---------- */
function newSetObj(firstServe){
  return {
    firstServe: firstServe || "us",           // 'us' | 'them'
    usOrder: [null,null,null,null,null,null], // サーブ順（背番号、未設定はnull）
    themOrder: [null,null,null,null,null,null],
    liberos: [],                              // 自チームのリベロ（最大2）
    log: [],                                  // rally / sub / timeout の時系列記録
    comment: "",
    setupDone: false,                         // セット設定を適用（確定）済みか
    finished: false,
    finalUs: null, finalThem: null,
    manualUs: 0, manualThem: 0                // 手動±1修正（ローテーション無関係）
  };
}
function newMatchObj(){
  return {
    id: uid(),
    title: "練習試合",
    date: todayStr(),
    startTime: "", endTime: "",
    place: "",
    opponent: "",
    goal: "",
    format: DEFAULT_FORMAT,   // 試合形式（MATCH_FORMATS のキー）
    rosterNames: {},        // {"1":"", ...} 任意入力・初期は空
    sets: [ newSetObj("us") ],
    status: "playing"       // 'playing' | 'finished'
  };
}
function getMatch(){ return DB.matches.find(m=>m.id===curMatchId) || null; }
function getSet(){ const m=getMatch(); if(!m) return null; return m.sets[curSetIdx] || null; }
/* セット設定が「適用済み」かどうか。
   旧データ互換のため、明示フラグがなくても「記録が始まっている」または
   「自チームのサーブ順が全て入力されている」セットは適用済みとして扱う。 */
function isSetupApplied(s){
  if(!s) return false;
  if(s.setupDone === true) return true;
  if(s.log && s.log.length > 0) return true;
  if(Array.isArray(s.usOrder) && s.usOrder.length === 6 && s.usOrder.every(x=>x!=null)) return true;
  return false;
}
function playerLabel(match, num){
  if(num==null || num==="") return "―";
  const nm = (match.rosterNames||{})[String(num)];
  return nm ? (num + " " + nm) : String(num);
}

/* ---------- セット再計算（スコア・サーブ権・ローテーション） ----------
   ログを先頭から再生し、各行の表示データと現在の状態を返す。
   サーブ順の考え方：サーブ権を得るたびに、そのチームのサーバーは
   サーブ順の次の選手になる。先攻チームの最初のサーバーは順の1人目、
   後攻チームは（ローテーションしてからサーブするので）順の2人目が最初。 */
function replaySet(set){
  const slots = { us: set.usOrder.slice(), them: set.themOrder.slice() };
  const st = {
    us: 0, them: 0,
    serve: set.firstServe,
    gains: { us: set.firstServe==="us" ? 1 : 0, them: set.firstServe==="them" ? 1 : 0 },
    slots: slots,
    timeouts: { us: 0, them: 0 },
    rows: []
  };
  function serverInfo(team){
    const base = (team === set.firstServe) ? 0 : 1;
    const idx = (((st.gains[team] - 1) + base) % 6 + 6) % 6;
    return { slot: idx, num: slots[team][idx] };
  }
  st.currentServer = function(){ return serverInfo(st.serve); };
  for(const e of set.log){
    if(e.kind === "rally"){
      const srv = serverInfo(st.serve);
      if(e.winner === "us") st.us++; else st.them++;
      st.rows.push({
        kind:"rally", serveTeam: st.serve, server: srv.num, serverSlot: srv.slot,
        winner: e.winner, us: st.us, them: st.them, note: e.note || "",
        actors: Array.isArray(e.actors) ? e.actors.slice() : [],
        storedServeTeam: e.serveTeam, storedServer: e.server
      });
      if(e.winner !== st.serve){ st.serve = e.winner; st.gains[st.serve]++; }
    } else if(e.kind === "sub"){
      const arr = slots[e.team];
      const i = arr.indexOf(e.out);
      if(i >= 0) arr[i] = e.in;
      st.rows.push({ kind:"sub", team:e.team, out:e.out, into:e.in, us:st.us, them:st.them });
    } else if(e.kind === "timeout"){
      st.timeouts[e.team]++;
      st.rows.push({ kind:"timeout", team:e.team, us:st.us, them:st.them });
    }
  }
  // 現在のコート上の配置（配列の index 0 がポジション1＝サーバーの位置）
  // サーブ順スロットはローテーション回数ぶん進んだ選手がポジション1に来る
  function courtPos(team){
    const rot = Math.max(0, st.gains[team] - (team === set.firstServe ? 1 : 0));
    const arr = [];
    for(let p=0;p<6;p++) arr.push(slots[team][(p + rot) % 6]);
    return arr;
  }
  st.positions = { us: courtPos("us"), them: courtPos("them") };
  st.dispUs = st.us + (set.manualUs||0);
  st.dispThem = st.them + (set.manualThem||0);
  return st;
}
function setEndReached(set, st, target){
  const u = st.dispUs, t = st.dispThem;
  const tg = (typeof target === "number") ? target : SET_TARGET;
  return (u >= tg || t >= tg) && Math.abs(u - t) >= 2;
}
function setsWon(match){
  let u=0, t=0;
  for(const s of match.sets){ if(s.finished){ if(s.finalUs > s.finalThem) u++; else if(s.finalThem > s.finalUs) t++; } }
  return { us:u, them:t };
}
/* ---------- 共通UI ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}
/* 手順エラー表示：画面上部の赤い帯に「何が違うか＋次に何を押すか」を出す。
   オーバーレイ表示のみでレイアウトは一切ずらさない。次の正しい操作で消える。 */
let errorTimer = null;
function showError(msg){
  const el = document.getElementById("error-flash");
  if(!el) return;
  el.textContent = "⚠ " + msg;
  el.classList.add("show");
  clearTimeout(errorTimer);
  errorTimer = setTimeout(()=> el.classList.remove("show"), 4500);
}
function clearError(){
  const el = document.getElementById("error-flash");
  if(el) el.classList.remove("show");
  clearTimeout(errorTimer);
}
/* ---------- サーブ権フラッシュ（サイドアウト時の一時表示） ----------
   状態は serveFlash に「どの試合・セット・ログ長で発生したか」を持たせ、
   描画側は現在の状態と一致するときだけコートのパルスを付ける。
   これにより undo・セット切替・別試合への移動で古い表示が残らない。 */
function showServeFlash(team){
  const m = getMatch(), s = getSet(); if(!m || !s) return;
  serveFlash = { team: team, matchId: m.id, setIdx: curSetIdx, logLen: s.log.length };
  const el = document.getElementById("serve-flash");
  if(el){
    el.textContent = "🏐 サーブ権 → " + (team === "us" ? usName() : (m.opponent || "相手"));
    el.classList.add("show");
  }
  if(serveFlashTimer) clearTimeout(serveFlashTimer);
  serveFlashTimer = setTimeout(clearServeFlash, SERVE_FLASH_MS);
}
function clearServeFlash(){
  serveFlash = null;
  if(serveFlashTimer){ clearTimeout(serveFlashTimer); serveFlashTimer = null; }
  const el = document.getElementById("serve-flash");
  if(el) el.classList.remove("show");
  document.querySelectorAll(".court-cell.serve-flash").forEach(c=> c.classList.remove("serve-flash"));
}
function openModal(html){
  document.getElementById("modal-holder").innerHTML =
    '<div class="modal-back" id="modal-back"><div class="modal">' + html + "</div></div>";
  document.getElementById("modal-back").addEventListener("click", e=>{
    if(e.target.id === "modal-back") closeModal();
  });
}
function closeModal(){ document.getElementById("modal-holder").innerHTML = ""; }
function confirmModal(msg, okLabel, onOk){
  openModal("<h3>確認</h3><p style='font-size:15px;line-height:1.6'>" + esc(msg) + "</p>" +
    '<div class="modal-btns"><button class="btn" id="cf-cancel">キャンセル</button>' +
    '<button class="btn danger" id="cf-ok">' + esc(okLabel) + "</button></div>");
  document.getElementById("cf-cancel").onclick = closeModal;
  document.getElementById("cf-ok").onclick = ()=>{ closeModal(); onOk(); };
}

/* ---------- ホーム ---------- */
function renderHome(){
  const tnInp = document.getElementById("inp-team-name");
  if(tnInp && document.activeElement !== tnInp) tnInp.value = (DB.settings && DB.settings.teamName) || "";
  document.getElementById("view-home").classList.remove("hidden");
  document.getElementById("view-match").classList.add("hidden");
  const rem = document.getElementById("export-reminder");
  if(rem){
    const last = appSettings().lastExportAt || 0;
    const days = Math.floor((Date.now() - last) / 86400000);
    if(DB.matches.length > 0 && days >= 7){
      rem.innerHTML = (last ? ("最後のJSON書出から " + days + " 日経っています。") : "JSON書出（バックアップ）がまだありません。") +
        'データはこの端末の中だけに保存されています。<button class="btn primary" id="btn-export-now">今すぐ書き出す</button>';
      rem.classList.remove("hidden");
      document.getElementById("btn-export-now").onclick = exportJSON;
    } else { rem.classList.add("hidden"); rem.innerHTML = ""; }
  }
  const list = document.getElementById("match-list");
  if(DB.matches.length === 0){
    list.innerHTML = '<div class="empty-note">まだ試合がありません。「＋ 新しい試合を作成」から始めてください。</div>';
    return;
  }
  const sorted = DB.matches.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"") || b.id.localeCompare(a.id));
  list.innerHTML = sorted.map(m=>{
    const w = setsWon(m);
    const setScores = m.sets.map((s,i)=> s.finished ? ("第"+(i+1)+": " + s.finalUs + "-" + s.finalThem) : null).filter(Boolean).join(" / ");
    return '<div class="match-card">' +
      '<div class="row"><div class="mc-title">' + esc(m.title || "試合") + '</div>' +
      (m.status==="finished" ? '<span style="font-size:12px;font-weight:800;color:var(--good-tx);background:var(--good-bg);border-radius:6px;padding:2px 8px;">終了</span>' : "") +
      '<div style="flex:1"></div>' +
      '<button class="btn primary" data-open="' + m.id + '">開く</button>' +
      '<button class="btn danger" data-del="' + m.id + '">削除</button></div>' +
      '<div class="mc-meta">' + esc(m.date || "") + (m.place ? " ・ " + esc(m.place) : "") + (m.opponent ? " ・ vs " + esc(m.opponent) : "") + '</div>' +
      '<div class="mc-score">セットカウント ' + esc(usName()) + ' ' + w.us + " － " + w.them + " " + esc(m.opponent || "相手") +
      (setScores ? '<span style="font-size:13px;color:var(--sub);font-weight:600;">　(' + esc(setScores) + ")</span>" : "") +
      (matchDecided(m) ? '<span style="font-size:13px;font-weight:800;">　🏆 ' + (matchDecided(m) === "us" ? esc(usName()) : esc(m.opponent || "相手")) + "の勝利</span>" : "") + "</div>" +
      "</div>";
  }).join("");
  list.querySelectorAll("[data-open]").forEach(b=> b.onclick = ()=> openMatch(b.getAttribute("data-open")));
  list.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
    const m = DB.matches.find(x=>x.id===b.getAttribute("data-del"));
    confirmModal("「" + (m ? m.title : "") + "」を削除しますか？この操作は元に戻せません。", "削除する", ()=>{
      DB.matches = DB.matches.filter(x=>x.id!==b.getAttribute("data-del"));
      saveDB(); renderHome(); toast("削除しました");
    });
  });
}
function openMatch(id){
  curMatchId = id; curSetIdx = 0; setupOpen = false; selActor = null; actorSkip = false; utilOpen = false;
  matchView = "record"; statsSetIdx = 0;
  clearServeFlash();
  guideStep = deriveGuideStep();
  renderMatch();
}

/* ---------- 試合画面 ---------- */
function renderMatch(){
  const m = getMatch(); if(!m){ renderHome(); return; }
  document.getElementById("view-home").classList.add("hidden");
  document.getElementById("view-match").classList.remove("hidden");
  if(curSetIdx >= m.sets.length) curSetIdx = m.sets.length - 1;
  const s = getSet(); const st = replaySet(s);
  const w = setsWon(m);

  document.getElementById("mt-title").textContent = (m.title || "試合") + (m.opponent ? "　vs " + m.opponent : "");
  document.getElementById("bs-us-name").textContent = usName();
  document.getElementById("sets-count").textContent = "セット " + usName() + " " + w.us + " － " + w.them + " " + (m.opponent || "相手");
  document.getElementById("fmt-label").textContent = "形式： " + matchFormat(m).short;
  document.getElementById("btn-finish-match").textContent = m.status === "finished" ? "試合を再開" : "試合終了";

  // ビュー切替（記録／統計・分析）
  const isStats = matchView === "stats";
  document.getElementById("view-record").classList.toggle("hidden", isStats);
  document.getElementById("view-stats").classList.toggle("hidden", !isStats);
  document.getElementById("btn-view-record").classList.toggle("view-on", !isStats);
  document.getElementById("btn-view-stats").classList.toggle("view-on", isStats);
  if(isStats){ renderStats(m); return; }

  // セットタブ
  const tabs = document.getElementById("set-tabs");
  let th = "";
  m.sets.forEach((ss,i)=>{
    const stt = replaySet(ss);
    const score = ss.finished ? (ss.finalUs + "-" + ss.finalThem) : (stt.dispUs + "-" + stt.dispThem);
    th += '<button class="set-tab' + (i===curSetIdx ? " cur" : "") + (ss.finished ? " fin" : "") + '" data-settab="' + i + '">第' + (i+1) + "セット " + score + (ss.finished ? " ✓" : "") + "</button>";
  });
  if(canAddNextSet(m)) th += '<button class="set-tab" id="btn-add-set">＋ 次のセット</button>';
  th += '<button class="set-tab" id="btn-toggle-setup" style="margin-left:auto;">⚙ セット設定（サーブ順）</button>';
  tabs.innerHTML = th;
  tabs.querySelectorAll("[data-settab]").forEach(b=> b.onclick = ()=>{ curSetIdx = Number(b.getAttribute("data-settab")); selActor = null; actorSkip = false; clearServeFlash(); guideStep = deriveGuideStep(); renderMatch(); });
  const addBtn = document.getElementById("btn-add-set");
  if(addBtn) addBtn.onclick = addNextSet;
  document.getElementById("btn-toggle-setup").onclick = ()=>{ setupOpen = !setupOpen; renderMatch(); };

  renderSetupPanel(m, s);
  renderScoreStrip(m, s, st);
  renderSetEnd(m, s, st);
  renderBook(m, s, st);
  renderSideCol(m, s, st);
  renderInputCol(m, s, st);

  const cmt = document.getElementById("set-comment");
  cmt.value = s.comment || "";
  document.getElementById("comment-label").textContent = "comment（第" + (curSetIdx+1) + "セット）";
}

function renderScoreStrip(m, s, st){
  document.getElementById("bs-us").textContent = st.dispUs;
  document.getElementById("bs-them").textContent = st.dispThem;
  document.getElementById("bs-opp-name").textContent = m.opponent || "相手";
  // サーブ権の常時表示：🏐 を現在のサーブチーム側に出す。
  // セット設定が未適用の間と、終了したセットでは出さない。
  const showBall = isSetupApplied(s) && !s.finished;
  const sbU = document.getElementById("sb-us"), sbT = document.getElementById("sb-them");
  if(sbU) sbU.classList.toggle("off", !(showBall && st.serve === "us"));
  if(sbT) sbT.classList.toggle("off", !(showBall && st.serve === "them"));
  const sn = document.getElementById("serve-now");
  if(s.finished){
    sn.textContent = "このセットは終了（" + s.finalUs + " － " + s.finalThem + "）";
  } else {
    const srv = st.currentServer();
    if(st.serve === "us"){
      sn.textContent = "サーブ： " + usName() + " " + (srv.num != null ? ("#" + srv.num + " " + ((m.rosterNames||{})[String(srv.num)] || "")) : "（サーブ順 未設定）");
    } else {
      sn.textContent = "サーブ： " + (m.opponent || "相手") + (srv.num != null ? (" #" + srv.num) : "");
    }
  }
  const mn = document.getElementById("manual-note");
  const adj = [];
  if(s.manualUs) adj.push(usName() + " 手動" + (s.manualUs>0?"+":"") + s.manualUs);
  if(s.manualThem) adj.push("相手 手動" + (s.manualThem>0?"+":"") + s.manualThem);
  mn.textContent = adj.length ? "※ " + adj.join(" / ") : "";
  // 「1つ戻す」はスコア帯に常時表示。記録が無いときだけ無効化する
  const bu = document.getElementById("btn-undo");
  if(bu) bu.disabled = (s.log.length === 0 || m.status === "finished");
  const sx = document.getElementById("streak-inline");
  if(sx){
    let run = 0, runTeam = null;
    for(let i = st.rows.length - 1; i >= 0; i--){
      const r = st.rows[i];
      if(r.kind !== "rally") continue;
      if(runTeam === null){ runTeam = r.winner; run = 1; }
      else if(r.winner === runTeam) run++;
      else break;
    }
    if(!s.finished && isSetupApplied(s) && runTeam && run >= 2){
      sx.textContent = "🔥 " + (runTeam === "us" ? usName() : (m.opponent || "相手")) + " " + run + "連続得点";
      sx.className = "streak-inline " + runTeam;
    } else { sx.textContent = ""; sx.className = "streak-inline"; }
  }
}

function renderSetEnd(m, s, st){
  const h = document.getElementById("setend-holder");
  let html = "";
  if(m.status === "finished"){
    html += '<div class="setend-banner">🔒 この試合は終了しています（記録を変更するには右上の「試合を再開」を押してください）</div>';
  }
  const dec = matchDecided(m);
  if(dec){
    const w = setsWon(m);
    html += '<div class="setend-banner">🏆 試合結果： ' + esc(usName()) + ' ' + w.us + " － " + w.them + " " + esc(m.opponent || "相手") +
      "（" + (dec === "us" ? esc(usName()) : esc(m.opponent || "相手")) + "の勝利）</div>";
  }
  if(s.finished){
    html += '<div class="setend-banner">第' + (curSetIdx+1) + "セット終了： " + esc(usName()) + " " + s.finalUs + " － " + s.finalThem + " " + esc(m.opponent || "相手") +
      '<button class="btn" id="btn-reopen-set">終了を取り消す</button></div>';
    h.innerHTML = html;
    document.getElementById("btn-reopen-set").onclick = ()=>{
      s.finished = false; s.finalUs = null; s.finalThem = null; actorSkip = false; guideStep = deriveGuideStep(); saveDB(); renderMatch();
    };
  } else if(setEndReached(s, st, setTargetFor(m, curSetIdx))){
    html += '<div class="setend-banner">🏁 セット終了の条件（' + setTargetFor(m, curSetIdx) + '点・2点差）を満たしました。<button class="btn primary" id="btn-finish-set">このセットを終了する</button></div>';
    h.innerHTML = html;
    document.getElementById("btn-finish-set").onclick = finishSet;
  } else {
    h.innerHTML = html;
  }
}
function finishSet(){
  const s = getSet(); if(!s || s.finished) return;
  const st = replaySet(s);
  s.finished = true; s.finalUs = st.dispUs; s.finalThem = st.dispThem;
  saveDB(); renderMatch();
  toast("第" + (curSetIdx+1) + "セットを終了しました");
}
function addNextSet(){
  const m = getMatch(); if(!m) return;
  if(matchDecided(m)){ toast("勝敗が決まっているため、これ以上セットは追加できません"); return; }
  if(m.sets.length >= matchFormat(m).maxSets){ toast("この試合形式は最大" + matchFormat(m).maxSets + "セットです"); return; }
  const prev = m.sets[m.sets.length - 1];
  const ns = newSetObj(prev.firstServe === "us" ? "them" : "us");
  m.sets.push(ns);
  curSetIdx = m.sets.length - 1;
  setupOpen = true; selActor = null; actorSkip = false;
  guideStep = deriveGuideStep();
  saveDB(); clearServeFlash(); renderMatch();
  toast("第" + m.sets.length + "セットを作成しました。サーブ順を設定してください");
}

function renderSetupSummary(m, s){
  const holder = document.getElementById("setup-holder");
  const order = s.usOrder.map(n=> n==null ? "―" : esc(playerLabel(m, n))).join(" → ");

    extra += "　リベロ： " + s.liberos.map(n=> "L " + esc(playerLabel(m, n))).join(" ・ ");
  if(s.themOrder.some(x=>x!=null))
    extra += "　" + esc(m.opponent || "相手") + "サーブ順： " + s.themOrder.map(n=> n==null ? "―" : n).join(" → ");
  holder.innerHTML =
    '<div class="setup-summary">' +
      '<span class="ss-txt">✓ 第' + (curSetIdx+1) + "セット設定済み（先攻：" + (s.firstServe === "us" ? esc(usName()) : esc(m.opponent || "相手")) + "）</span>" +

      '<button class="btn" id="btn-open-setup">設定を開く</button>' +

/* セット設定を適用（確定）する。サーブ順が揃っていない場合は閉じない。 */
function applySetup(){
  const m = getMatch(), s = getSet(); if(!m || !s) return false;
  if(s.usOrder.some(x=>x==null)){
    showError("セット設定が終わっていません。" + usName() + "のサーブ順（6名）をすべて選んでください");
    return false;
  }
  if(new Set(s.usOrder).size !== 6){
    showError(usName() + "のサーブ順に同じ背番号が重複しています。6名それぞれ別の選手を選んでください");
    return false;
  }
  const libDup = (s.liberos || []).find(n => s.usOrder.includes(n));
  if(libDup != null){
    showError("No." + libDup + " はサーブ順とリベロの両方に選ばれています。どちらかを変更してください");
    return false;
  }
  s.setupDone = true;
  setupOpen = false;
  actorSkip = false;
  clearError();
  guideStep = deriveGuideStep();
  saveDB(); renderMatch();
  toast("第" + (curSetIdx+1) + "セットの設定を適用しました");
  return true;
}

  }
  libOpts += "</div>";
  holder.innerHTML =

      '<div><div style="font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px;">先攻（最初のサーブ）</div>' +
      '<span class="seg"><button data-first="us" class="' + (s.firstServe==="us"?"on":"") + '">' + esc(usName()) + '</button><button data-first="them" class="' + (s.firstServe==="them"?"on":"") + '">' + esc(m.opponent || "相手") + "</button></span></div>" +
      (curSetIdx > 0 ? '<button class="btn" id="btn-copy-order">前セットのサーブ順をコピー</button>' : "") +
      (hasRallies ? '<span style="font-size:12px;color:var(--warn-tx);font-weight:700;">※ 記録が始まったセットのサーブ順変更は表示に影響します</span>' : "") +
    "</div>" +
    '<div class="setup-grid">' +
      '<div><div class="sg-title">' + esc(usName()) + ' サーブ順（スタメン6名）</div>' + orderSelects("us", s.usOrder) +
        '<div class="sg-title" style="margin-top:10px;">リベロ（最大2名・任意）</div>' + libOpts + "</div>" +
      '<div><div class="sg-title">' + esc(m.opponent || "相手") + ' サーブ順（任意・番号入力）</div>' + orderSelects("them", s.themOrder) +
        '<div style="font-size:12px;color:var(--sub);margin-top:6px;">未入力でも記録できます（サーバーは「相手」と表示）。</div></div>' +
    "</div>" +
    '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">' +
      '<button class="btn primary" id="btn-apply-setup" style="flex:1;">✓ この設定を適用する</button>' +
      (isSetupApplied(s) ? '<button class="btn" id="btn-close-setup">閉じる</button>' : "") +
    "</div></div>";
  holder.querySelectorAll("[data-first]").forEach(b=> b.onclick = ()=>{
    s.firstServe = b.getAttribute("data-first"); saveDB(); renderMatch();
  });
  holder.querySelectorAll("[data-order]").forEach(el=>{
    el.addEventListener("change", ()=>{
      const team = el.getAttribute("data-order"), pos = Number(el.getAttribute("data-pos"));
      const v = el.value === "" ? null : Number(el.value);
      if(team === "us") s.usOrder[pos] = v; else s.themOrder[pos] = (v==null || isNaN(v)) ? null : v;

  holder.querySelectorAll("[data-libero]").forEach(el=>{
    el.addEventListener("change", ()=>{
