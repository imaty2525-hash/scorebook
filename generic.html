    const prev = m.sets[curSetIdx - 1]; if(!prev) return;
    s.usOrder = prev.usOrder.slice();
    s.themOrder = prev.themOrder.slice();
    s.liberos = prev.liberos.slice();
    saveDB(); renderMatch(); toast("前セットのサーブ順をコピーしました");
  };
  const ap = document.getElementById("btn-apply-setup");
  if(ap) ap.onclick = applySetup;
  const cl = document.getElementById("btn-close-setup");
  if(cl) cl.onclick = ()=>{ setupOpen = false; renderMatch(); };
}

/* ---------- スコアブック表の自動フィット ----------
   ラリー数が増えても表がスクロールしないよう、実測しながら密度ティアを
   段階的に上げる（文字・行間・列幅を少しずつ詰める）。下限は最終ティア：
   本文 9px／摘要 8.5px／行パディング 0／行高 1.15。
   下限でも収まらない長いセットでは、表エリアだけをスクロール可能に切り替え
   （.fit-scroll）、新しい行が入るたびにコンテナの scrollTop を直接操作して
   最新行まで自動スクロールする（scrollIntoView はページ全体を動かすので使わない）。 */
const BOOK_FIT_TIERS = [
  { bfs:14,   bnfs:13,   pad:4, srv:64, ptw:52, lh:1.35 },
  { bfs:13,   bnfs:12,   pad:3, srv:60, ptw:48, lh:1.30 },
  { bfs:12.5, bnfs:11.5, pad:2, srv:56, ptw:46, lh:1.30 },
  { bfs:12,   bnfs:11,   pad:2, srv:52, ptw:44, lh:1.25 },
  { bfs:11,   bnfs:10.5, pad:1, srv:50, ptw:42, lh:1.25 },
  { bfs:10.5, bnfs:10,   pad:1, srv:48, ptw:40, lh:1.20 },
  { bfs:10,   bnfs:9.5,  pad:0, srv:46, ptw:38, lh:1.20 },
  { bfs:9.5,  bnfs:9,    pad:0, srv:44, ptw:36, lh:1.18 },
  { bfs:9,    bnfs:8.5,  pad:0, srv:42, ptw:34, lh:1.15 }
];
function applyBookTier(tb, tier){
  const t = BOOK_FIT_TIERS[tier];
  tb.style.setProperty("--bfs", t.bfs + "px");
  tb.style.setProperty("--bnfs", t.bnfs + "px");
  tb.style.setProperty("--bpad", t.pad + "px");
  tb.style.setProperty("--bsrv", t.srv + "px");
  tb.style.setProperty("--bptw", t.ptw + "px");
  tb.style.setProperty("--blh", String(t.lh));
  tb.setAttribute("data-fit-tier", String(tier));
}
function fitBook(){
  const sc = document.getElementById("book-scroll");
  const tb = document.getElementById("book-table");
  if(!sc || !tb) return 0;
  let tier = 0;
  applyBookTier(tb, 0);
  let guard = 0;
  while(guard++ < BOOK_FIT_TIERS.length + 2){
    const avail = sc.clientHeight;
    if(!avail || avail <= 0) break;              // 非表示時などは計測しない
    if(tb.offsetHeight <= avail) break;          // 収まった
    if(tier >= BOOK_FIT_TIERS.length - 1) break; // 下限ティア到達
    tier++;
    applyBookTier(tb, tier);
  }
  const over = sc.clientHeight > 0 && tb.offsetHeight > sc.clientHeight;
  tb.setAttribute("data-fit-overflow", over ? "1" : "0");
  // 収まっている間は表エリアもスクロールさせない。はみ出す場合だけ表エリアを
  // スクロール可能にし、最新行まで自動スクロールする（ページ全体は動かさない）。
  sc.classList.toggle("fit-scroll", over);
  sc.scrollTop = over ? sc.scrollHeight : 0;
  // ヘッダー2行目の sticky 位置合わせ：1行目（チーム見出し）の実高さを測って渡す
  const hr = tb.querySelector("thead tr");
  if(hr && hr.offsetHeight > 0) tb.style.setProperty("--bth1", hr.offsetHeight + "px");
  return tier;
}

/* ---------- スコアブック表 ---------- */
function renderBook(m, s, st){
  const opp = m.opponent || "相手";
  let h = "<thead>" +
    '<tr class="team-head"><th colspan="3" class="th-us">Team ' + esc(usName()) + '</th><th colspan="3" class="th-them">Team ' + esc(opp) + "</th></tr>" +
    "<tr><th class='c-server'>サーバー</th><th class='c-point'>得点</th><th>摘要</th>" +
    "<th class='c-server'>サーバー</th><th class='c-point'>得点</th><th>摘要</th></tr></thead><tbody>";
  // 最新の得点セルをハイライトするため、最後のラリー行の位置を先に求める
  let lastRallyIdx = -1;
  st.rows.forEach((r, i)=>{ if(r.kind === "rally") lastRallyIdx = i; });
  if(st.rows.length === 0){
    h += '<tr><td colspan="6" style="color:var(--sub);padding:16px;">まだ記録がありません。右の「+1」ボタンで得点を記録してください。</td></tr>';
  }
  st.rows.forEach((r, i)=>{
    const last = i === st.rows.length - 1;
    if(r.kind === "rally"){
      // サーバーはサーブ側の列（丸バッジ表示）、得点は得点したチーム側の列に
      // そのチームの新しい累計を出し、摘要はプレーをした選手のチーム側の列に出す
      const np = notePartsByTeam(m, r);
      const srvCell = (team)=>{
        if(r.serveTeam !== team) return '<td class="c-server"></td>';
        const label = r.server != null ? r.server : (team === "us" ? "―" : "相手");
        return '<td class="c-server"><span class="srv-badge">' + label + "</span></td>";
      };
      const ptCell = (team)=>{
        if(r.winner !== team) return '<td class="c-point"></td>';
        return '<td class="c-point ' + team + (i === lastRallyIdx ? " pt-new" : "") + '">' + (team === "us" ? r.us : r.them) + "</td>";
      };
      const usCells = srvCell("us") + ptCell("us") + '<td class="c-note">' + esc(np.us) + "</td>";
      const themCells = srvCell("them") + ptCell("them") + '<td class="c-note">' + esc(np.them) + "</td>";
      h += '<tr class="' + (last ? "latest" : "") + '">' + usCells + themCells + "</tr>";
    } else if(r.kind === "sub"){
      const txt = "交代 " + r.out + " → " + r.into + "（" + r.us + "-" + r.them + "）";
      const usCells = r.team === "us"
        ? '<td class="c-server"></td><td class="c-point us">' + r.us + '</td><td class="c-note">' + esc(txt) + "</td>"
        : '<td class="c-server"></td><td class="c-point"></td><td class="c-note"></td>';
      const themCells = r.team === "them"
        ? '<td class="c-server"></td><td class="c-point them">' + r.them + '</td><td class="c-note">' + esc(txt) + "</td>"
        : '<td class="c-server"></td><td class="c-point"></td><td class="c-note"></td>';
      h += '<tr class="note-row' + (last ? " latest" : "") + '">' + usCells + themCells + "</tr>";
    } else if(r.kind === "timeout"){
      const txt = "タイムアウト（" + r.us + "-" + r.them + "）";
      const usCells = r.team === "us"
        ? '<td class="c-server"></td><td class="c-point us">' + r.us + '</td><td class="c-note">' + esc(txt) + "</td>"
        : '<td class="c-server"></td><td class="c-point"></td><td class="c-note"></td>';
      const themCells = r.team === "them"
        ? '<td class="c-server"></td><td class="c-point them">' + r.them + '</td><td class="c-note">' + esc(txt) + "</td>"
        : '<td class="c-server"></td><td class="c-point"></td><td class="c-note"></td>';
      h += '<tr class="note-row' + (last ? " latest" : "") + '">' + usCells + themCells + "</tr>";
    }
  });
  if(s.finished){
    h += '<tr class="final-row"><td colspan="6">最終スコア　' + esc(usName()) + ' ' + s.finalUs + " － " + s.finalThem + " " + esc(opp) + "</td></tr>";
  }
  h += "</tbody>";
  document.getElementById("book-table").innerHTML = h;
  fitBook();
}
/* ---------- コート表示（ローテーション位置） ---------- */
function courtHTML(m, s, st, team, mini){
  const pos = st.positions[team];
  const cell = (p)=>{ // p: ポジション番号 1〜6
    const num = pos[p-1];
    const isServer = !s.finished && st.serve === team && p === 1;
    // サイドアウト直後は新しいサーバーをパルス表示（状態が現在の試合・セット・ログ長と一致するときだけ）
    const flashHere = isServer && serveFlash && serveFlash.team === team &&
      serveFlash.matchId === m.id && serveFlash.setIdx === curSetIdx && serveFlash.logLen === s.log.length;
    // 名前は自チームのみ小さく併記（ロスター登録がある場合だけ）
    const nm = (team === "us" && num != null) ? (m.rosterNames || {})[String(num)] : "";
    return '<div class="court-cell' + (isServer ? " server" : "") + (flashHere ? " serve-flash" : "") + '" data-court="' + team + '" data-pos="' + p + '">' +
      '<span class="pos">' + p + "</span>" +
      '<span class="cnum">' + (num != null ? num : "―") + "</span>" +
      (nm ? '<span class="cname">' + esc(nm) + "</span>" : "") +
      (isServer ? '<span class="sball">🏐</span>' : "") + "</div>";
  };
  // 上段＝前衛（ネット側）4・3・2、下段＝後衛 5・6・1、間に3mライン
  return '<div class="court' + (mini ? " mini" : "") + '">' +
    '<div class="court-title">' + (team === "us" ? esc(usName()) + " コート" : esc(m.opponent || "相手") + " コート") + "</div>" +
    '<div class="court-net"></div>' +
    '<div class="court-grid">' + cell(4) + cell(3) + cell(2) + "</div>" +
    '<div class="court-3m"></div>' +
    '<div class="court-grid">' + cell(5) + cell(6) + cell(1) + "</div>" +
    "</div>";
}
function renderSideCol(m, s, st){
  const col = document.getElementById("side-col");
  if(!col) return;
  let h = courtHTML(m, s, st, "us", false);
  if((s.liberos||[]).length){
    h += '<div class="libero-row"><span class="libero-label">リベロ</span>' +
      s.liberos.map(n=>'<span class="libero-chip">L ' + esc(playerLabel(m, n)) + "</span>").join("") + "</div>";
  }
  // 相手コートはサーブ順が登録されている場合のみ小さく併記
  if(s.themOrder.some(x=>x!=null)) h += courtHTML(m, s, st, "them", true);
  col.innerHTML = h;
}

/* ---------- 入力列 ---------- */
const QUICK_NOTES_POINT = ["サービスエース","スパイク","フェイント・プッシュ","ブロック","相手ミス"];
const QUICK_NOTES_MISS = ["スパイクミス","サーブミス","レセプションミス","ディグミス","ドリブル","その他ミス"];
/* 「誰が」セレクタ：コート上の6人＋リベロ（相手はサーブ順未登録なら番号入力） */
function actorSelectorHTML(m, s, st){
  const locked = s.finished || m.status === "finished";
  const dis = locked ? " disabled" : "";
  const opp = m.opponent || "相手";
  const btn = (team, num, extraCls, inner)=>{
    const on = selActor && selActor.team === team && selActor.num === num;
    return '<button class="actor-btn' + (extraCls || "") + (on ? " on" : "") + '" data-actor="' + team + ":" + num + '"' + dis + ">" + inner + "</button>";
  };
  // 自チーム用：番号＋名前（小さく）の2段表示にする
  const usInner = (num, prefix)=>{
    const nm = (m.rosterNames || {})[String(num)];
    return '<span class="anum">' + (prefix || "") + num + "</span>" +
      (nm ? '<span class="aname">' + esc(nm) + "</span>" : "");
  };
  // 見出し（②バッジ＋「誰が」＋案内文＋『不明』ボタン）は renderInputCol 側の step-head が担う。
  // ここでは選択中だけ、その内訳を補足行として出す。
  let h = "";
  if(selActor){
    const selName0 = selActor.team === "us" ? ((m.rosterNames || {})[String(selActor.num)] || "") : "";
    h = '<div class="col-label actor-sel-note">選択中： ' + esc(selActor.team === "us" ? usName() : opp) + " No." + selActor.num + (selName0 ? " " + esc(selName0) : "") + "（再タップで解除）</div>";
  } else if(actorSkip){
    h = '<div class="col-label actor-sel-note">選択中： 不明（選手なしで摘要を付けます）</div>';
  }
  h += '<div class="actor-team">' + esc(usName()) + '</div><div class="actor-btns">';
  st.positions.us.forEach(n=>{ if(n != null) h += btn("us", n, "", usInner(n, "")); });
  (s.liberos||[]).forEach(n=>{ h += btn("us", n, " lib", usInner(n, "L")); });
  if(st.positions.us.every(n=>n==null) && (s.liberos||[]).length === 0)
    h += '<span style="font-size:12px;color:var(--sub);">サーブ順を設定すると選手ボタンが出ます</span>';
  h += "</div>";
  h += '<div class="actor-team">' + esc(opp) + "</div>";
  if(s.themOrder.some(x=>x!=null)){
    h += '<div class="actor-btns them-grid">';
    st.positions.them.forEach(n=>{ if(n != null) h += btn("them", n, "", String(n)); });
    h += "</div>";
  } else {
    const selThem = selActor && selActor.team === "them";
    h += '<div class="actor-num-row"><input type="number" id="actor-them-num" min="1" max="99" inputmode="numeric" placeholder="番号" value="' + (selThem ? selActor.num : "") + '"' + (dis || (!locked && deriveGuideStep() === 1) ? " disabled" : "") + ">" +
      '<button class="actor-btn' + (selThem ? " on" : "") + '" id="btn-actor-them"' + dis + ">" + (selThem ? "解除" : "選択") + "</button></div>";
  }
  return h;
}
/* フローガイドの行き先を現在の状態から決め直す（undo・セット切替・試合を開く・設定適用などのときに使う）。
   直前ラリーに摘要がまだ無ければ、そのラリーへの入力が続く：選手選択中か『不明』を押していれば③摘要、どちらも無ければ②誰が。
   直前ラリーに摘要がある／ラリーが無い／セット終了済みなら、次のラリーの起点＝①得点。 */
function deriveGuideStep(){
  const s = getSet();
  if(!s || s.finished) return 1;
  const r = lastRallyEntry(s);
  if(r && !r.note) return (selActor || actorSkip) ? 3 : 2;
  return 1;
}
function renderInputCol(m, s, st){
  const col = document.getElementById("input-col");
  // セット設定が未適用の間は得点入力を使えない（設定パネルが開いている状態を優先）
  if(!isSetupApplied(s)){
    col.innerHTML = '<div class="setup-locked">⚙ まず上の「セット設定」でサーブ順を入力し、「✓ この設定を適用する」を押してください。適用すると得点・摘要の入力が使えます。</div>';
    return;
  }
  const locked = s.finished || m.status === "finished";
  const dis = locked ? " disabled" : "";
  const opp = m.opponent || "相手";
  // 選択中の選手が交代などで対象から外れていたら選択を解除する
  if(selActor){
    if(selActor.team === "us"){
      if(!st.positions.us.includes(selActor.num) && !(s.liberos||[]).includes(selActor.num)) selActor = null;
    } else if(s.themOrder.some(x=>x!=null) && !st.positions.them.includes(selActor.num)){
      selActor = null;
    }
  }
  // フローガイドの正規化：選択状態と矛盾する行き先は、現在の状態から決め直す
  // （例：交代で選択中の選手がコートを離れて選択が解除された場合）
  if(guideStep === 3 && !selActor && !actorSkip) guideStep = deriveGuideStep();
  else if(guideStep === 2 && (selActor || actorSkip)) guideStep = 3;
  const gz = locked ? 0 : guideStep;
  const zoneAttr = n=> ' class="step-zone' + (gz === n ? " guide" : "") +
    ((n === 2 && gz === 1) || (n === 3 && (gz === 1 || gz === 2)) ? " locked" : "") + '" data-zone="' + n + '"';
  let h = "";
  h += "<div" + zoneAttr(1) + ">" +
    '<div class="step-head"><span class="step-badge">1</span>得点<span class="step-sub">' + (gz === 1 ? "得点が入ったらタップ" : "次の得点もここから") + '</span></div>' +
    '<div class="pt-btns">' +
    '<button class="pt-btn us" id="pt-us"' + dis + ">" + esc(usName()) + " +1</button>" +
    '<button class="pt-btn them" id="pt-them"' + dis + ">" + esc(opp) + " +1</button></div></div>";
  const sub2 = gz === 1 ? "🔒 ①得点のあとで選べます" :
    (gz === 2 ? "プレーした選手をタップ" : (selActor ? "選択中です（変更できます）" : "『不明』で進みました"));
  h += "<div" + zoneAttr(2) + ">" +
    '<div class="step-head"><span class="step-badge">2</span>誰が<span class="step-sub">' + sub2 + '</span>' +
    '<button class="unknown-btn' + (actorSkip ? " on" : "") + '" id="btn-actor-unknown"' + dis + ">不明</button></div>" +
    actorSelectorHTML(m, s, st) + "</div>";
  const sub3 = gz === 1 ? "🔒 ①②のあとで選べます" :
    (gz === 2 ? "🔒 ②『誰が』のあとで選べます" : "内容をタップ（なければ次の得点へ）");
  h += "<div" + zoneAttr(3) + ">" +
    '<div class="step-head"><span class="step-badge">3</span>摘要<span class="step-sub">' + sub3 + '</span></div>' +
    '<div class="note-group-label pt">得点</div><div class="chip-grid">';
  QUICK_NOTES_POINT.forEach(q=>{ h += '<button class="chip pt" data-note="' + esc(q) + '"' + dis + ">" + esc(q) + "</button>"; });
  h += '</div><div class="note-group-label ms">ミス</div><div class="chip-grid">';
  QUICK_NOTES_MISS.forEach(q=>{ h += '<button class="chip ms" data-note="' + esc(q) + '"' + dis + ">" + esc(q) + "</button>"; });
  h += "</div></div>";
  h += '<div class="util-wrap">';
  h += '<button class="ubtn util-toggle" id="btn-util-toggle">⚙ その他（交代・TO・メモ・修正）' + (utilOpen ? " ▴" : " ▾") + '</button>';
  h += '<div class="util-zone' + (utilOpen ? "" : " hidden") + '" id="util-zone">';
  h += '<div class="memo-row"><input type="text" id="memo-input" placeholder="メモ（自由入力）"' + dis + '><button class="chip" id="btn-memo"' + dis + ">メモ追加</button></div>";
  h += '<div class="col-label">交代・タイムアウト</div><div class="util-btns">' +
    '<button class="ubtn" id="btn-sub-us"' + dis + ">交代（" + esc(usName()) + "）</button>" +
    '<button class="ubtn" id="btn-sub-them"' + dis + ">交代（" + esc(opp) + "）</button>" +
    '<button class="ubtn" id="btn-to-us"' + (locked || st.timeouts.us >= TIMEOUT_MAX ? " disabled" : "") + ">タイムアウト " + esc(usName()) + "（残" + (TIMEOUT_MAX - st.timeouts.us) + "）</button>" +
    '<button class="ubtn" id="btn-to-them"' + (locked || st.timeouts.them >= TIMEOUT_MAX ? " disabled" : "") + ">タイムアウト " + esc(opp) + "（残" + (TIMEOUT_MAX - st.timeouts.them) + "）</button></div>";
  h += '<div class="col-label">タイマー</div><div class="util-btns">' +
    '<button class="ubtn wide" id="btn-timer-open">⏱ タイマー（セット間3分／TO30秒）</button></div>';
  h += '<div class="col-label">修正</div><div class="util-btns">' +
    '<button class="ubtn wide" id="btn-finish-set2"' + (locked ? " disabled" : "") + ">セット終了</button></div>";
  h += '<div class="manual-row"><span style="font-size:13px;font-weight:700;color:var(--sub);">スコア手動修正</span>' +
    '<button class="mbtn" data-madj="us,1"' + dis + '>自+1</button><button class="mbtn" data-madj="us,-1"' + dis + '>自-1</button>' +
    '<button class="mbtn" data-madj="them,1"' + dis + '>相+1</button><button class="mbtn" data-madj="them,-1"' + dis + '>相-1</button></div>';
  h += '<div style="font-size:12px;color:var(--sub);">手動修正はサーブ権・ローテーションに影響しません。</div></div></div>';
  col.innerHTML = h;

  const pus = document.getElementById("pt-us"), pth = document.getElementById("pt-them");
  if(pus) pus.onclick = ()=>{ clearError(); actorSkip = false; addPoint("us"); };
  if(pth) pth.onclick = ()=>{ clearError(); actorSkip = false; addPoint("them"); };
  const but = document.getElementById("btn-util-toggle");
  if(but) but.onclick = ()=>{ utilOpen = !utilOpen; renderMatch(); };
  const bto = document.getElementById("btn-timer-open");
  if(bto) bto.onclick = ()=>{ openTimer(); };
  col.querySelectorAll("[data-actor]").forEach(b=> b.onclick = ()=>{
    if(flowStepNow() === 1){ showError("②『誰が』は、①得点を押したあとで選びます。まず得点ボタンを押してください"); return; }
    const parts = b.getAttribute("data-actor").split(":");
    const a = { team: parts[0], num: Number(parts[1]) };
    selActor = (selActor && selActor.team === a.team && selActor.num === a.num) ? null : a;
    if(selActor) actorSkip = false;
    clearError();
    guideStep = deriveGuideStep();
    renderMatch();
  });
  const bat = document.getElementById("btn-actor-them");
  if(bat) bat.onclick = ()=>{
    if(flowStepNow() === 1){ showError("②『誰が』は、①得点を押したあとで選びます。まず得点ボタンを押してください"); return; }
    if(selActor && selActor.team === "them"){ selActor = null; guideStep = deriveGuideStep(); renderMatch(); return; }
    const inp = document.getElementById("actor-them-num");
    const v = inp ? Number(inp.value) : 0;
    if(!v){ showError("相手の番号を入力してから『選択』を押してください"); return; }
    selActor = { team: "them", num: v };
    actorSkip = false;
    clearError();
    guideStep = deriveGuideStep();
    renderMatch();
  };
  const buk = document.getElementById("btn-actor-unknown");
  if(buk) buk.onclick = ()=>{
    if(flowStepNow() === 1){ showError("②『誰が』は、①得点を押したあとで選びます。まず得点ボタンを押してください"); return; }
    selActor = null;
    actorSkip = true;
    clearError();
    guideStep = deriveGuideStep();
    renderMatch();
  };
  col.querySelectorAll("[data-note]").forEach(b=> b.onclick = ()=> uiApplyNote(b.getAttribute("data-note")));
  const bm = document.getElementById("btn-memo");
  if(bm) bm.onclick = ()=>{
    const inp = document.getElementById("memo-input");
    const v = inp.value.trim(); if(!v) return;
    if(!lastRallyEntry(s)){ showError("まだ得点が記録されていません。メモは直前のラリーに付くので、①まず得点を記録してください"); return; }
    clearError();
    applyNote(v, null); inp.value = "";
  };
  const bsu = document.getElementById("btn-sub-us"); if(bsu) bsu.onclick = ()=> openSubModal("us");
  const bst = document.getElementById("btn-sub-them"); if(bst) bst.onclick = ()=> openSubModal("them");
  const btu = document.getElementById("btn-to-us"); if(btu) btu.onclick = ()=> addTimeout("us");
  const btt = document.getElementById("btn-to-them"); if(btt) btt.onclick = ()=> addTimeout("them");
  const bf = document.getElementById("btn-finish-set2"); if(bf) bf.onclick = ()=>{
    if(setEndReached(s, replaySet(s), setTargetFor(m, curSetIdx))){ finishSet(); return; }
    confirmModal("まだセット終了の点数に達していません。このセットを終了しますか？", "終了する", finishSet);
  };
  col.querySelectorAll("[data-madj]").forEach(b=> b.onclick = ()=>{
    const parts = b.getAttribute("data-madj").split(",");
    manualAdjust(parts[0], Number(parts[1]));
  });
}


/* ---------- 記録アクション ---------- */
function addPoint(winner){
  const m = getMatch(), s = getSet(); if(!m || !s || s.finished || m.status === "finished") return;
  const st = replaySet(s);
  const srv = st.currentServer();
  const serveBefore = st.serve;
  s.log.push({
    kind: "rally",
    serveTeam: st.serve,
    server: srv.num,
    winner: winner,
    note: "",
    actors: []
  });
  saveDB();
  // サイドアウト（サーブ権が移った）ときだけフラッシュ表示する。
  // サーブ継続の得点では出さず、残っていた古いフラッシュも消す。
  if(winner !== serveBefore) showServeFlash(winner); else clearServeFlash();
  // フローガイド：得点を入れたら次は「②誰が」（選手を選択中なら「③摘要」へ直行）
  guideStep = selActor ? 3 : 2;
  renderMatch();
}
function lastRallyEntry(s){
  for(let i = s.log.length - 1; i >= 0; i--){ if(s.log[i].kind === "rally") return s.log[i]; }
  return null;
}
/* 現在の入力手順（①得点→②誰が→③摘要）の段階を返す。セット終了時は 0。 */
function flowStepNow(){
  const s = getSet();
  if(!s || s.finished) return 0;
  return deriveGuideStep();
}
/* 摘要チップのUI入口：手順が違う場合は記録せず、エラーで止める。
   ①得点が無い／直前ラリーに摘要済み／②『誰が』未選択（『不明』も未押下）のいずれもここで弾く。 */
function uiApplyNote(text){
  const m = getMatch(), s = getSet(); if(!m || !s || s.finished) return;
  const r = lastRallyEntry(s);
  if(!r){
    showError("まだ得点が記録されていません。①まず『" + usName() + " +1』か『" + (m.opponent || "相手") + " +1』を押してください");
    return;
  }
  if(r.note){
    showError("そのラリーの摘要は記録済みです。次の得点が入ったら、①得点 → ②誰が → ③摘要 の順で入力してください");
    return;
  }
  if(!selActor && !actorSkip){
    showError("②『誰が』がまだ選ばれていません。そのプレーをした選手を押してください。分からないときは『不明』を押してください");
    return;
  }
  clearError();
  applyNote(text);
  actorSkip = false;
}
/* 摘要を直前ラリーに付ける。actor 省略時は現在の「誰が」選択を使い、
   {team, num} を渡すと「内容 No.○」として記録し actors にも構造化保持する。
   null を渡すと選手なし（メモ用）。 */
function applyNote(text, actor){
  const m = getMatch(), s = getSet(); if(!m || !s || s.finished || m.status === "finished") return;
  const r = lastRallyEntry(s);
  if(!r){ toast("先に得点を記録してください"); return; }
  if(actor === undefined) actor = selActor;
  const seg = actor ? (text + " No." + actor.num) : text;
  r.note = r.note ? (r.note + " / " + seg) : seg;
  if(actor){
    if(!Array.isArray(r.actors)) r.actors = [];
    r.actors.push({ team: actor.team, num: actor.num, text: text });
  }
  // フローガイド：摘要を付けたら次のラリーの起点「①得点」に戻す
  guideStep = 1;
  saveDB(); renderMatch();
}
function addTimeout(team){
  const m = getMatch(), s = getSet(); if(!m || !s || s.finished || m.status === "finished") return;
  const st = replaySet(s);
  if(st.timeouts[team] >= TIMEOUT_MAX){ toast("タイムアウトは1セット" + TIMEOUT_MAX + "回までです"); return; }
  s.log.push({ kind: "timeout", team: team });
  saveDB(); renderMatch();
  toast("タイムアウトを記録しました");
}
function undoLast(){
  const m = getMatch(), s = getSet(); if(!m || !s || s.log.length === 0) return;
  if(m.status === "finished"){ showError("終了した試合は直せません。直す場合は『試合を再開』を押してください"); return; }
  if(s.finished){ showError("終了したセットは直せません。直す場合は『終了を取り消す』を押してください"); return; }
  const last = s.log[s.log.length - 1];
  if(last && last.kind === "rally" && last.note){
    last.note = "";
    last.actors = [];
    actorSkip = false;
    clearError();
    guideStep = deriveGuideStep();
    saveDB(); renderMatch();
    toast("直前の摘要を取り消しました（得点は残っています）");
    return;
  }
  const removed = s.log.pop();
  actorSkip = false;
  clearError();
  guideStep = deriveGuideStep();
  saveDB(); clearServeFlash(); renderMatch();
  toast(removed.kind === "rally" ? "直前のラリーを取り消しました" : "直前の記録を取り消しました");
}
function manualAdjust(team, delta){
  const s = getSet(); if(!s || s.finished) return;
  const st = replaySet(s);
  if(team === "us"){
    const nd = (s.manualUs||0) + delta;
    if(st.us + nd < 0) return;
    s.manualUs = nd;
  } else {
    const nd = (s.manualThem||0) + delta;
    if(st.them + nd < 0) return;
    s.manualThem = nd;
  }
  saveDB(); renderMatch();
}

    '<p style="font-size:13px;color:var(--sub);">交代はスコアブックの摘要に記録され、サーブ順の位置は入る選手が引き継ぎます。</p>' +

/* ---------- 統計・分析 ---------- */
/* 1ラリーに付いた摘要カテゴリを「出現」単位で取り出す。
   actors（構造化記録）を正とし、摘要文字列だけに残っている分は actor なし（team:null）として数える。 */
function rallyOccurrences(row){
  const occ = [];
  const used = [];
  (Array.isArray(row.actors) ? row.actors : []).forEach(a=>{
    if(QUICK_NOTES_POINT.includes(a.text) || QUICK_NOTES_MISS.includes(a.text)){
      occ.push({ cat: a.text, team: a.team, num: a.num });
      used.push(a.text);
    }
  });
  const cats = QUICK_NOTES_POINT.concat(QUICK_NOTES_MISS).slice().sort((a,b)=> b.length - a.length);
  String(row.note || "").split(" / ").map(x=>x.trim()).filter(Boolean).forEach(seg=>{
    const cat = cats.find(c=> seg === c || seg.startsWith(c + " "));
    if(!cat) return;
    const i = used.indexOf(cat);
    if(i >= 0){ used.splice(i, 1); return; }   // actor側で数えた分と二重にしない
    occ.push({ cat: cat, team: null, num: null });
  });
  return occ;
}
/* 集計ルール：
   - 得点の内訳：自チームが得点したラリーだけを対象に、得点系カテゴリの出現を数える。無ければ「未記録」。
   - ミスの内訳：失点したラリーだけを対象に、ミス系カテゴリの出現を数える（相手actorのミスは除く）。
   - 選手別：自チームactorの出現を、得点系＝「得点関与」／ミス系＝「ミス」として選手ごとに数える。
   - 選手未記録：カテゴリは付いたが選手が選ばれていない出現（得点側・ミス側を分けて保持）。 */
function computeStats(m){
  const point = {}; QUICK_NOTES_POINT.forEach(c=> point[c] = 0);
  const miss = {}; QUICK_NOTES_MISS.forEach(c=> miss[c] = 0);
  const players = {};
  const unrecPlayer = { points: 0, misses: 0 };
  let unrecorded = 0;
  m.sets.forEach(s=>{
    replaySet(s).rows.forEach(r=>{
      if(r.kind !== "rally") return;
      const occ = rallyOccurrences(r);
      if(r.winner === "us"){
        const pts = occ.filter(o=> QUICK_NOTES_POINT.includes(o.cat));
        if(pts.length === 0) unrecorded++;
        pts.forEach(o=>{
          point[o.cat]++;
          if(o.team == null) unrecPlayer.points++;
        });
      } else {
        occ.filter(o=> QUICK_NOTES_MISS.includes(o.cat) && o.team !== "them")
          .forEach(o=>{
            miss[o.cat]++;
            if(o.team == null) unrecPlayer.misses++;
          });
      }
      occ.forEach(o=>{
        if(o.team !== "us" || o.num == null) return;
        const p = players[o.num] || (players[o.num] = { points: 0, misses: 0 });
        if(QUICK_NOTES_POINT.includes(o.cat)) p.points++;
        else if(QUICK_NOTES_MISS.includes(o.cat)) p.misses++;
      });
    });
  });
  return { point: point, miss: miss, unrecorded: unrecorded, players: players, unrecPlayer: unrecPlayer };
}
/* セット内のスコア推移（ラリーごとの累計。手動±1修正は含まない） */
function scoreSeries(set){
  const pts = [{ us: 0, them: 0 }];
  replaySet(set).rows.forEach(r=>{ if(r.kind === "rally") pts.push({ us: r.us, them: r.them }); });
  return pts;
}
function lineChartSVG(series, oppName){
  if(series.length <= 1) return '<div class="stats-empty">このセットはまだ記録がありません。</div>';
  const W = 680, H = 250, pl = 36, pr = 16, pt = 16, pb = 28;
  const n = series.length - 1;
  const maxS = Math.max(10, Math.max.apply(null, series.map(p=> Math.max(p.us, p.them))));
  const X = i => pl + (W - pl - pr) * i / n;
  const Y = v => pt + (H - pt - pb) * (1 - v / maxS);
  const path = key => series.map((p,i)=> (i === 0 ? "M" : "L") + X(i).toFixed(1) + "," + Y(p[key]).toFixed(1)).join(" ");
  let g = "";
  [0, Math.round(maxS / 2), maxS].forEach(v=>{
    g += '<line x1="' + pl + '" y1="' + Y(v) + '" x2="' + (W - pr) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pl - 6) + '" y="' + (Y(v) + 4) + '" font-size="11" text-anchor="end" fill="var(--sub)">' + v + "</text>";
  });
  const last = series[series.length - 1];
  return '<svg class="stats-svg" viewBox="0 0 ' + W + " " + H + '" role="img">' + g +
    '<path d="' + path("us") + '" fill="none" stroke="#2563eb" stroke-width="2.5"/>' +
    '<path d="' + path("them") + '" fill="none" stroke="#ea580c" stroke-width="2.5"/>' +
    '<circle cx="' + X(n) + '" cy="' + Y(last.us) + '" r="4" fill="#2563eb"/>' +
    '<circle cx="' + X(n) + '" cy="' + Y(last.them) + '" r="4" fill="#ea580c"/>' +
    '<text x="' + pl + '" y="' + (H - 8) + '" font-size="11" fill="var(--sub)">ラリー数： ' + n + "</text>" +
    '<text x="' + (W - pr) + '" y="' + (H - 8) + '" font-size="12" font-weight="700" text-anchor="end">' +
      '<tspan fill="#3b82f6">― ' + esc(usName()) + ' ' + last.us + '</tspan><tspan fill="#fb923c">　― ' + esc(oppName || "相手") + ' ' + last.them + "</tspan></text>" +
    "</svg>";
}
function barChartSVG(items, color){
  const rowH = 27, labelW = 128, valW = 40, W = 680;
  const max = Math.max(1, Math.max.apply(null, items.map(i=> i.value)));
  const barMax = W - labelW - valW;
  let rows = "";
  items.forEach((it, i)=>{
    const y = i * rowH + 4;
    const bw = Math.round(barMax * it.value / max);
    rows += '<text x="0" y="' + (y + 15) + '" font-size="13" fill="var(--txt)">' + esc(it.label) + "</text>" +
      '<rect x="' + labelW + '" y="' + y + '" width="' + (it.value > 0 ? Math.max(bw, 3) : 0) + '" height="17" rx="4" fill="' + color + '"/>' +
      '<text x="' + (labelW + bw + 8) + '" y="' + (y + 15) + '" font-size="13" font-weight="700" fill="var(--txt)">' + it.value + "</text>";
  });
  return '<svg class="stats-svg" viewBox="0 0 ' + W + " " + (items.length * rowH + 6) + '" role="img">' + rows + "</svg>";
}
function playerTableHTML(m, cs){
  const nums = Object.keys(cs.players).map(Number).sort((a,b)=> a - b);
  let h = '<table class="stats-table"><tr><th>選手</th><th>得点関与</th><th>ミス</th></tr>';
  if(nums.length === 0 && cs.unrecPlayer.points === 0 && cs.unrecPlayer.misses === 0){
    return h + '<tr><td colspan="3" style="color:var(--sub);text-align:center;">選手を指定した摘要の記録がまだありません</td></tr></table>';
  }
  nums.forEach(n=>{
    const p = cs.players[n];
    h += "<tr><td>" + esc(playerLabel(m, n)) + "</td><td>" + p.points + "</td><td>" + p.misses + "</td></tr>";
  });
  if(cs.unrecPlayer.points > 0 || cs.unrecPlayer.misses > 0){
    h += "<tr><td>選手未記録</td><td>" + cs.unrecPlayer.points + "</td><td>" + cs.unrecPlayer.misses + "</td></tr>";
  }
  return h + "</table>";
}
function renderStats(m){

  });
  h += '</div><div style="font-size:13px;color:var(--sub);font-weight:700;">セットカウント： ' + esc(usName()) + ' ' + w.us + " － " + w.them + " " + esc(opp) +
    "（形式： " + esc(matchFormat(m).label) + "）" +

  // スコア推移
  const sNow = m.sets[statsSetIdx];

  h += "</div>";
  // 内訳（得点／ミス）
  h += '<div class="stats-grid">';
  h += '<div class="card stats-card"><h3>得点の内訳（' + esc(usName()) + '）</h3>' +
    barChartSVG(QUICK_NOTES_POINT.map(c=> ({ label: c, value: cs.point[c] })).concat([{ label: "未記録", value: cs.unrecorded }]), "#0da271") + "</div>";

  h += "</div>";
  // 選手別

/* ---------- 印刷（スコアブック形式） ---------- */
/* 摘要の表示用整形：自チームの選手が actors に記録されていてロスターに名前があれば
   「内容 No.○ 名前」の形に名前を併記する（画面の表・印刷で共用。保存データは番号のみのまま） */
function noteWithName(m, r){
  let note = r.note || "";
  (r.actors || []).forEach(a=>{
    if(a.team !== "us") return;
    const nm = (m.rosterNames || {})[String(a.num)];
    if(!nm) return;
    const pat = a.text + " No." + a.num;
    const idx = note.indexOf(pat);
    if(idx < 0) return;
    if(note.slice(idx + pat.length, idx + pat.length + nm.length + 1) === " " + nm) return; // 併記済み
    note = note.slice(0, idx + pat.length) + " " + nm + note.slice(idx + pat.length);
  });
  return note;
}
/* 印刷用はこちらと同じ整形を使う（従来名の互換エイリアス） */
function noteForPrint(m, r){ return noteWithName(m, r); }
/* 摘要を表示する列をセグメント単位で振り分ける（画面・印刷で共用）。
   摘要は「そのプレーをした選手のチーム側」の列に出すのが原則：
   - actor のあるセグメント → その選手のチーム側（氏名併記もセグメント単位）
   - actor のない得点系チップ → 得点したチーム側／ミス系チップ → 失点したチーム側
   - メモ（自由入力）等のどれにも当たらないセグメント → サーブ側（従来通り）
   サーバー番号・得点セルはサーブ側のままなので、この関数は摘要テキストだけを返す。 */
function notePartsByTeam(m, r){
  const parts = { us: [], them: [] };
  if(!r || !r.note) return { us: "", them: "" };
  const actors = (Array.isArray(r.actors) ? r.actors : []).slice();
  const cats = QUICK_NOTES_POINT.concat(QUICK_NOTES_MISS).slice().sort((a,b)=> b.length - a.length);
  const loser = r.winner === "us" ? "them" : "us";
  String(r.note).split(" / ").forEach(seg=>{
    if(!seg) return;
    let ai = -1;
    for(let i = 0; i < actors.length; i++){
      if(seg === actors[i].text + " No." + actors[i].num){ ai = i; break; }
    }
    if(ai >= 0){
      const a = actors.splice(ai, 1)[0];
      let disp = seg;
      if(a.team === "us"){
        const nm = (m.rosterNames || {})[String(a.num)];
        if(nm && disp.slice(disp.length - nm.length - 1) !== " " + nm) disp = seg + " " + nm;
      }
      parts[a.team === "them" ? "them" : "us"].push(disp);
      return;
    }
    const cat = cats.find(c=> seg === c || seg.indexOf(c + " ") === 0);
    if(cat && QUICK_NOTES_POINT.indexOf(cat) >= 0) parts[r.winner === "them" ? "them" : "us"].push(seg);
    else if(cat) parts[loser].push(seg);
    else parts[r.serveTeam === "them" ? "them" : "us"].push(seg);
  });
  return { us: parts.us.join(" / "), them: parts.them.join(" / ") };
}
function buildPrint(){
  const m = getMatch(); if(!m) return;
  const opp = m.opponent || "相手";
  const w = setsWon(m);
  let h = '<div class="p-title-row">' + LOGO_SVG + '<h1>バレーボール スコアブック</h1></div>';
  h += '<table class="p-head"><tr><td style="width:50%;">試合名： ' + esc(m.title) + "</td><td>日時： " + esc(m.date) + "</td></tr>" +
    "<tr><td>場所： " + esc(m.place) + " 体育館</td><td>開始： " + esc(m.startTime) + "　終了： " + esc(m.endTime) + "</td></tr>" +
    "<tr><td>対戦： " + esc(usName()) + " vs " + esc(opp) + "</td><td>セットカウント： " + esc(usName()) + " " + w.us + " － " + w.them + " " + esc(opp) + "</td></tr>" +
    "<tr><td colspan='2'>今日の目標： " + esc(m.goal) + "</td></tr>" +
    "<tr><td colspan='2'>試合形式： " + esc(matchFormat(m).label) +
    (matchDecided(m) ? "　／　試合結果： " + esc(usName()) + " " + w.us + " － " + w.them + " " + esc(opp) + "（" + (matchDecided(m) === "us" ? esc(usName()) : esc(opp)) + "の勝利）" : "") + "</td></tr></table>";
  // セット結果サマリー
  const pMaxSets = matchFormat(m).maxSets;
  h += "<h2>セット結果</h2><table><tr>";
  for(let i=0;i<pMaxSets;i++) h += "<th>第" + (i+1) + "SET</th>";
  h += "</tr><tr>";
  for(let i=0;i<pMaxSets;i++){
    const s = m.sets[i];
    h += "<td>" + (s && s.finished ? (esc(usName()) + " " + s.finalUs + " － " + s.finalThem) : "―") + "</td>";
  }
  h += "</tr></table>";
  // 各セット
  m.sets.forEach((s, i)=>{
    const st = replaySet(s);
    h += '<div class="p-set"><h2>第' + (i+1) + "セット" + (s.finished ? "（最終スコア： " + esc(usName()) + " " + s.finalUs + " － " + s.finalThem + " " + esc(opp) + "）" : "") + "</h2>";
    h += "<table><tr><th colspan='3'>Team " + esc(usName()) + "</th><th colspan='3'>Team " + esc(opp) + "</th></tr>" +
      "<tr><th>サーバー</th><th>得点</th><th>摘要</th><th>サーバー</th><th>得点</th><th>摘要</th></tr>";
    st.rows.forEach(r=>{
      if(r.kind === "rally"){
        // サーバーはサーブ側の列（丸囲みの小さい数字）、得点は得点したチーム側の列に
        // そのチームの新しい累計を大きく太く出し、摘要はプレーをした選手のチーム側の列に出す
        const np = notePartsByTeam(m, r);
        const srvP = (team)=>{
          if(r.serveTeam !== team) return "<td></td>";
          const label = r.server != null ? r.server : (team === "us" ? "―" : "相手");
          return "<td><span class='p-srv'>" + label + "</span></td>";
        };
        const ptP = (team)=>{
          if(r.winner !== team) return "<td></td>";
          return "<td class='p-pt'>" + (team === "us" ? r.us : r.them) + "</td>";
        };
        const u = srvP("us") + ptP("us") + "<td class='note'>" + esc(np.us) + "</td>";
        const t = srvP("them") + ptP("them") + "<td class='note'>" + esc(np.them) + "</td>";
        h += "<tr>" + u + t + "</tr>";
      } else if(r.kind === "sub"){
        const txt = "交代 " + r.out + " → " + r.into + "（" + r.us + "-" + r.them + "）";
        const u = r.team === "us" ? "<td></td><td class='p-pt'>" + r.us + "</td><td class='note'>" + esc(txt) + "</td>" : "<td></td><td></td><td class='note'></td>";
        const t = r.team === "them" ? "<td></td><td class='p-pt'>" + r.them + "</td><td class='note'>" + esc(txt) + "</td>" : "<td></td><td></td><td class='note'></td>";
        h += "<tr>" + u + t + "</tr>";
      } else if(r.kind === "timeout"){
        const txt = "タイムアウト（" + r.us + "-" + r.them + "）";
        const u = r.team === "us" ? "<td></td><td class='p-pt'>" + r.us + "</td><td class='note'>" + esc(txt) + "</td>" : "<td></td><td></td><td class='note'></td>";
        const t = r.team === "them" ? "<td></td><td class='p-pt'>" + r.them + "</td><td class='note'>" + esc(txt) + "</td>" : "<td></td><td></td><td class='note'></td>";
        h += "<tr>" + u + t + "</tr>";
      }
    });
    h += "</table>";
    h += '<div class="p-comment">comment： ' + esc(s.comment || "") + "</div></div>";
  });
  document.getElementById("print-area").innerHTML = h;
}

/* ---------- JSON 書出 / 読込 ---------- */
function exportJSON(){
  appSettings().lastExportAt = Date.now(); saveDB();
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "volleyball-scorebook_" + todayStr() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
  if(!curMatchId) renderHome();
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.matches)) throw new Error("bad format");
      confirmModal("現在のデータを読み込むJSONで置き換えますか？（" + d.matches.length + "試合）", "置き換える", ()=>{
        DB = normalizeData(d); curMatchId = null; saveDB(); renderHome(); toast("読み込みました");
      });
    }catch(e){ toast("JSONの形式が正しくありません"); }
  };
  reader.readAsText(file);
}

/* ---------- 追加機能：タイマー／ダークモード ---------- */
let timerState = { total: 180, remain: 180, endAt: 0, intId: null, running: false };
function fmtTimer(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function timerRender(){
  const t = fmtTimer(timerState.remain);
  const tp = document.getElementById("tp-time"); if(tp) tp.textContent = t;
  const pill = document.getElementById("timer-pill"); if(pill) pill.textContent = "⏱ " + t;
  const st = document.getElementById("tp-start"); if(st) st.textContent = timerState.running ? "⏸ 一時停止" : "▶ スタート";
}
function timerShowPill(){ const p = document.getElementById("timer-pill"); if(p) p.classList.remove("hidden"); }
function beep(times){
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    const ctx = beep.ctx || (beep.ctx = new AC());
    const t0 = ctx.currentTime;
    for(let i=0;i<times;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t0 + i*0.35);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + i*0.35 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i*0.35 + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0 + i*0.35); o.stop(t0 + i*0.35 + 0.3);
    }
  }catch(e){}
}
function timerFinish(){
  timerState.running = false;
  if(timerState.intId){ clearInterval(timerState.intId); timerState.intId = null; }
  timerState.remain = 0; timerRender();
  const pill = document.getElementById("timer-pill"); if(pill) pill.classList.add("done");
  beep(3); toast("⏱ タイマー終了");
}
function timerStartPause(){
  if(timerState.running){
    timerState.running = false;
    timerState.remain = Math.max(0, (timerState.endAt - Date.now())/1000);
    if(timerState.intId){ clearInterval(timerState.intId); timerState.intId = null; }
    timerRender(); return;
  }
  if(timerState.remain <= 0) timerState.remain = timerState.total;
  timerState.running = true;
  timerState.endAt = Date.now() + timerState.remain*1000;
  const pill = document.getElementById("timer-pill"); if(pill) pill.classList.remove("done");
  timerShowPill();
  timerState.intId = setInterval(()=>{
    timerState.remain = (timerState.endAt - Date.now())/1000;
    if(timerState.remain <= 0){ timerFinish(); return; }
    timerRender();
  }, 200);
  timerRender();
}
function timerSet(sec){
  timerState.total = sec; timerState.remain = sec; timerState.running = false;
  if(timerState.intId){ clearInterval(timerState.intId); timerState.intId = null; }
  const pill = document.getElementById("timer-pill"); if(pill) pill.classList.remove("done");
  timerShowPill(); timerRender();
}
function openTimer(){ const p = document.getElementById("timer-panel"); if(p) p.classList.remove("hidden"); timerRender(); }
function closeTimer(){ const p = document.getElementById("timer-panel"); if(p) p.classList.add("hidden"); }
function applyTheme(){
  const dark = !!appSettings().dark;
  if(dark) document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  const b1 = document.getElementById("btn-theme"); if(b1) b1.textContent = dark ? "☀️ ライト" : "🌙 ダーク";
  const b2 = document.getElementById("btn-theme2"); if(b2) b2.textContent = dark ? "☀️" : "🌙";
}
function toggleTheme(){ const s = appSettings(); s.dark = !s.dark; saveDB(); applyTheme(); }

/* ---------- 初期化 ---------- */
function init(){
  /* ---- iPad Safari対策：入力中の「余計な画面の動き」をなくす ----
     ・記録画面では、スクロール可能な専用領域（はみ出した表・統計・モーダル・
       縦向き時のメイン領域）以外での touchmove を抑止し、ラバーバンドや
       ページ全体のずり下がりを防ぐ（ホーム画面では通常通り）。
     ・ボタンはタップ後にフォーカスを外す。再描画でフォーカス中の要素が消えると
       ブラウザが画面位置を動かすことがあるため。
     ・万一文書がスクロールしたら即座に原点へ戻す。 */
  document.addEventListener("touchmove", e=>{
    if(!curMatchId) return; // 記録画面以外は何もしない
    const t = e.target;
    if(t.closest && t.closest("input, textarea, select")) return;
    if(t.closest && t.closest("#view-stats, .modal")) return;
    const bs = t.closest ? t.closest(".book-scroll") : null;
    if(bs && bs.classList.contains("fit-scroll")) return; // はみ出した表だけはスクロール可
    const rm = t.closest ? t.closest(".record-main") : null;
    if(rm && rm.scrollHeight > rm.clientHeight + 1) return; // 縦向き時など実際にスクロールできる場合のみ
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("click", e=>{
    const b = e.target && e.target.closest ? e.target.closest("button") : null;
    if(b && document.activeElement === b) b.blur();
  });
  window.addEventListener("scroll", ()=>{
    if(window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
  }, { passive: true });
  document.getElementById("logo-badge").innerHTML = logoSVG("h", "");
  const saveTeamName = ()=>{
    if(!DB.settings || typeof DB.settings !== "object") DB.settings = { teamName: "" };
    DB.settings.teamName = document.getElementById("inp-team-name").value.trim();
    saveDB(); renderHome(); toast("自チーム名を保存しました");
  };
  document.getElementById("btn-save-team").onclick = saveTeamName;
  document.getElementById("inp-team-name").addEventListener("change", saveTeamName);
  document.getElementById("btn-new-match").onclick = ()=>{
    const m = newMatchObj();
    DB.matches.push(m); saveDB();
    curMatchId = m.id; curSetIdx = 0; setupOpen = true; selActor = null; actorSkip = false; guideStep = 1;
    renderMatch();
    openHeaderEdit();
  };
  document.getElementById("btn-export").onclick = exportJSON;
  const bt1 = document.getElementById("btn-theme"); if(bt1) bt1.onclick = toggleTheme;
  const bt2 = document.getElementById("btn-theme2"); if(bt2) bt2.onclick = toggleTheme;
  const tpS = document.getElementById("tp-start"); if(tpS) tpS.onclick = timerStartPause;
  const tpR = document.getElementById("tp-reset"); if(tpR) tpR.onclick = ()=> timerSet(timerState.total);
  const tpC = document.getElementById("tp-close"); if(tpC) tpC.onclick = closeTimer;
  const tpP1 = document.getElementById("tp-preset-set"); if(tpP1) tpP1.onclick = ()=> timerSet(180);
  const tpP2 = document.getElementById("tp-preset-to"); if(tpP2) tpP2.onclick = ()=> timerSet(30);
  const tpill = document.getElementById("timer-pill"); if(tpill) tpill.onclick = openTimer;
  applyTheme(); refreshSaveStatus(); timerRender();
  document.getElementById("btn-import").onclick = ()=> document.getElementById("file-import").click();
  document.getElementById("file-import").addEventListener("change", e=>{
    if(e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = "";
  });
  document.getElementById("btn-back-home").onclick = ()=>{ curMatchId = null; clearServeFlash(); renderHome(); };
  document.getElementById("btn-undo").onclick = undoLast;
  window.addEventListener("resize", ()=>{ if(curMatchId && matchView === "record") fitBook(); });
  document.getElementById("btn-view-record").onclick = ()=>{ matchView = "record"; renderMatch(); };
  document.getElementById("btn-view-stats").onclick = ()=>{ matchView = "stats"; statsSetIdx = curSetIdx; renderMatch(); };
  document.getElementById("btn-edit-header").onclick = openHeaderEdit;
  document.getElementById("btn-print").onclick = ()=>{ buildPrint(); window.print(); };
  document.getElementById("btn-finish-match").onclick = ()=>{
    const m = getMatch(); if(!m) return;
    m.status = m.status === "finished" ? "playing" : "finished";
    saveDB(); renderMatch();
    toast(m.status === "finished" ? "試合を終了にしました" : "試合を再開しました");
  };
  document.getElementById("set-comment").addEventListener("change", e=>{
    const s = getSet(); if(!s) return;
    s.comment = e.target.value; saveDB();
  });
  renderHome();
}
init();
